<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>iMOPS — Boot</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;}
  body{font-family:'Courier New',monospace;}
  #rain{position:fixed;inset:0;display:block;}
  #scan{position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px,rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply;z-index:4;}
  #vign{position:fixed;inset:0;pointer-events:none;
    box-shadow:inset 0 0 220px 60px rgba(0,0,0,0.9);z-index:4;}

  /* boot terminal text */
  #boot{position:fixed;left:6%;top:12%;z-index:3;
    font-size:15px;line-height:1.7;letter-spacing:0.5px;
    color:#7CFFB0;text-shadow:0 0 6px rgba(0,255,120,0.45);
    white-space:pre;max-width:88%;}
  .cursor{display:inline-block;width:9px;height:16px;
    background:#7CFFB0;box-shadow:0 0 8px rgba(0,255,120,0.6);
    margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* banner reveal */
  #banner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.98);
    width:min(86vw,1100px);z-index:2;opacity:0;
    filter:drop-shadow(0 0 26px rgba(0,200,255,0.25)) brightness(0.92);
    transition:opacity 2.6s ease, transform 2.6s ease;}
  #banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

  #hint{position:fixed;right:16px;bottom:14px;z-index:5;
    font-size:11px;letter-spacing:1px;color:#2a4;opacity:0.0;
    transition:opacity 1.5s ease;}
  #hint.show{opacity:0.5;}
</style>

  <div id="boot"></div>
  <div id="scan"></div>
  <div id="vign"></div>
  <div id="hint">[ klick = neu hochfahren ]</div>
<script>
(function(){
  // ---- colour flow (green -> amber -> red -> back), for the calm after-boot ----
  var anchors = {
    green: {head:[180,255,180], body:[40,180,70],  glow:[0,255,90]},
    amber: {head:[255,220,150], body:[190,120,20], glow:[255,160,0]},
    red:   {head:[255,170,170], body:[170,40,40],  glow:[255,40,40]}
  };
  var route=["green","amber","red","amber"], cycleMs=48000, segMs=cycleMs/route.length;
  function lerp(a,b,t){return a+(b-a)*t;}
  function mix(c1,c2,t){return [Math.round(lerp(c1[0],c2[0],t)),Math.round(lerp(c1[1],c2[1],t)),Math.round(lerp(c1[2],c2[2],t))];}
  function easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  var bootColor={head:[140,255,176],body:[40,180,70],glow:[0,255,120]};
  var flowStart=null; // set when boot finishes; before that we stay green

  function palette(now){
    if(flowStart===null) return bootColor;
    var t0=now-flowStart;
    var pos=(t0%cycleMs)/segMs, i=Math.floor(pos), t=easeInOut(pos-i);
    var a=anchors[route[i]], b=anchors[route[(i+1)%route.length]];
    return {head:mix(a.head,b.head,t),body:mix(a.body,b.body,t),glow:mix(a.glow,b.glow,t)};
  }

  // ---- matrix rain ----
  var cv=document.getElementById("rain"), ctx=cv.getContext("2d");
  var W,H,cols,drops,fontSize=16,dim=1.0;
  var glyphs="アイウエオカキクケコサシスセソﾀﾁﾂﾃﾄナニヌネノ0123456789MOPSBINDA<>=/\\:.".split("");
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;
    cols=Math.floor(W/fontSize);drops=[];for(var i=0;i<cols;i++)drops[i]=Math.random()*-(H/fontSize);}
  resize();window.addEventListener("resize",resize);
  function rgba(c,a){return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";}
  function draw(){
    var now=performance.now(), p=palette(now);
    ctx.fillStyle="rgba(0,0,0,0.085)";ctx.fillRect(0,0,W,H);
    ctx.font=fontSize+"px 'Courier New', monospace";
    for(var i=0;i<cols;i++){
      var ch=glyphs[Math.floor(Math.random()*glyphs.length)];
      var x=i*fontSize, y=drops[i]*fontSize;
      ctx.shadowColor=rgba(p.glow,0.5*dim);ctx.shadowBlur=7;
      ctx.fillStyle=rgba(p.head,0.62*dim);ctx.fillText(ch,x,y);
      ctx.shadowBlur=0;ctx.fillStyle=rgba(p.body,0.30*dim);
      ctx.fillText(glyphs[Math.floor(Math.random()*glyphs.length)],x,y-fontSize);
      if(y>H&&Math.random()>0.985)drops[i]=0;
      drops[i]+=0.5;
    }
  }
  setInterval(draw,75);

  // ---- boot sequence ----
  var bootEl=document.getElementById("boot");
  var banner=document.getElementById("banner");
  var hint=document.getElementById("hint");
  var lines=[
    {t:"> MOPS-TERM v1.0  —  System Engine for Human Workflows", d:30},
    {t:"> init kernel ............... ok", d:18},
    {t:"> qdrant  [bau_wissen_v1] ... 2653 chunks", d:18},
    {t:"> ollama  [llama3.2:3b] ..... ok", d:18},
    {t:"> claude-fallback ........... bereit", d:18},
    {t:"> persona ................... Maurermeister-Bibliothekar wach", d:18},
    {t:"> heartbeat ................. dum ... dum ... dum", d:30},
    {t:"", d:12},
    {t:"^Bin da ;=)", d:70}
  ];
  var li=0, ci=0, buf="";
  var cursor='<span class="cursor"></span>';

  function typeStep(){
    if(li>=lines.length){ finishBoot(); return; }
    var line=lines[li];
    if(ci<line.t.length){
      buf+=line.t[ci]; ci++;
      bootEl.innerHTML=buf+cursor;
      setTimeout(typeStep, line.d + Math.random()*20);
    } else {
      buf+="\n"; li++; ci=0;
      bootEl.innerHTML=buf+cursor;
      setTimeout(typeStep, (line.t==="^Bin da ;=)")?900:140);
    }
  }

  function finishBoot(){
    // hold the final prompt a beat, then reveal the banner and let colours flow
    bootEl.innerHTML=buf+cursor;
    setTimeout(function(){
      banner.classList.add("show");        // pug glows in through the rain
      dim=0.55;                            // rain steps back, stays as ambience
      flowStart=performance.now();         // colours begin to drift
    }, 700);
    setTimeout(function(){
      bootEl.style.transition="opacity 2.2s ease";
      bootEl.style.opacity="0.0";          // boot text dissolves
    }, 2600);
    setTimeout(function(){ hint.classList.add("show"); }, 5200);
  }

  setTimeout(typeStep, 600);

  // click = reboot the whole thing
  window.addEventListener("click", function(){
    banner.classList.remove("show");
    bootEl.style.transition="none"; bootEl.style.opacity="1";
    buf=""; li=0; ci=0; dim=1.0; flowStart=null;
    hint.classList.remove("show");
    setTimeout(typeStep, 400);
  });
})();
</script>
