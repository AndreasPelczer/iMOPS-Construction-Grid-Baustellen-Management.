# Wartezeiten — die Tage, an denen NIEMAND arbeitet
#
# Andreas, 21.09.2026, über die Ablaufplan-Skizze: „erst hat man den Bagger gesehen,
# dann ?? dann Zeit … es ging um Trockenzeit oder so, das habe ich sofort verstanden."
#
# Beton härten, Estrich trocknen, Putz abbinden: da steht niemand auf der Baustelle,
# aber alles Folgende schiebt sich. Ohne diese Tage ist jeder Terminplan zu optimistisch.
#
# 🔴 Gemessen am 21.09.2026: `Bauablauf` RECHNET Wartezeiten seit jeher mit
# (`AblaufKante.wartezeitTage`) — aber alle 598 Kanten in der Datenbank standen auf 0.
# Es hat sie nur nie jemand eingetragen. Dieser Katalog schlägt sie vor.
#
# Die Werte sind ÜBLICHE PRAXISWERTE, keine Normvorgabe. Sie hängen von Zement,
# Temperatur, Bauteil und Belastung ab — deshalb trägt jeder Eintrag seinen
# `hinweis`, und der Mops schlägt sie nur VOR. Wer sie übernimmt, entscheidet.
# Raphi muss da einmal drüberschauen.

