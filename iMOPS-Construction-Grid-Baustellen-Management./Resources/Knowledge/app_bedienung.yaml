- id: "App_Unterlagen_auswerten"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Unterlagen auswerten"
    - "Dokument auswerten"
    - "Bodengutachten auswerten"
    - "Wohnflaeche auslesen"
    - "Bebauungsplan auslesen"
    - "Erschliessung auslesen"
    - "PDF Fakten herausziehen"
    - "Wo werte ich Unterlagen aus"
    - "Auswertung speichern"
    - "Ausgewertete Unterlagen ansehen"
    - "gespeicherte Auswertung wieder aufrufen"
  antwort: |
    In einer Baustelle gibt es die Karte "Unterlagen auswerten" (zwischen
    "Plaene & CAD" und "Material").
    1. Button "Auswerten" tippen -> die Sammel-Ansicht "Unterlagen sammeln" oeffnet sich.
    2. "Weitere Dateien hinzufuegen" tippen und PDFs waehlen. Der Datei-Dialog zeigt
       immer nur EINEN Ordner - fuer Dateien aus mehreren Ordnern den Schritt einfach
       wiederholen, die Auswahl sammelt sich in der Liste (einzelne mit dem Papierkorb
       wieder entfernen). Dann oben "Auswerten (N)" tippen.
    3. Der Mops liest die Textebene und zieht die LV-relevanten Fakten heraus:
       - Bodengutachten (Bodenklassen, Frosttiefe, Grundwasser, Abdichtung)
       - Wohnflaechen-/Rauminhaltsberechnung (m2 je Raum, BRI)
       - Bebauungsplan (GRZ/GFZ, Hoehen, Dach, Erdarbeiten)
       - Erschliessung (Medien/Dimensionen, Warnungen z.B. 20-kV-Leitung)
    4. Das Ergebnis oeffnet sich als Liste zum Pruefen ("Ergebnis ansehen").
       Je Dokument steht ganz oben eine Kurz-Zusammenfassung mit den wichtigsten
       Fakten (z.B. Bodenklasse + Frosttiefe + Grundwasser, oder Zone + GRZ),
       darunter alle Felder im Detail.
    5. SPEICHERN: In der Ergebnis-Liste ist jedes Dokument mit einem Haekchen
       vorausgewaehlt. Nicht Gewuenschte abwaehlen, dann oben rechts "Speichern".
       "Fertig" schliesst OHNE zu speichern.
    6. WIEDER AUFRUFEN: Gespeicherte Auswertungen erscheinen in derselben Karte
       unter "Ausgewertete Unterlagen (N)" — antippen zeigt die Fakten wieder an,
       OHNE dass der Mops erneut rechnen muss (offline, sofort). Dasselbe PDF
       erneut ausgewertet ersetzt den alten Eintrag (kein Duplikat).

    WICHTIG: Das ist ein KI-Entwurf aus der PDF-Textebene, kein Gutachten und
    kein Vermesser-Ergebnis — vor Verwendung pruefen. Reine Zeichnungen ohne
    Textebene werden uebersprungen (die gehoeren zur Vision-Auswertung).
    Das Auswerten braucht Verbindung zum Mops-Server; das Wieder-Aufrufen nicht.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_BPlan_Vorgaben"
  kategorie: "app-bedienung"
