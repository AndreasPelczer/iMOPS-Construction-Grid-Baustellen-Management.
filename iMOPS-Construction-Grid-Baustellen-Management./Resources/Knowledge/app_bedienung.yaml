    - "Bauvorgaben Baustelle"
  antwort: |
    Wenn ein Bebauungsplan ueber "Unterlagen auswerten" ausgewertet UND gespeichert
    wurde, erscheint in der Baustelle (Karte "Plaene & Unterlagen") die Karte
    "Vorgaben aus dem Bebauungsplan". Sie zeigt die ausgelesenen Vorgaben als Liste:
    Zone, GRZ/GFZ, max. Wand-/Firsthoehe, max. Abgrabung/Auffuellung/Stuetzwand,
    Dachform + Neigung, Stellplatz-Pflicht, Pflanzgebot.

    Das sind REINE ZITATE aus dem Dokument (KI-Auslesung, im Zweifel am Plan pruefen) -
    es findet noch KEIN Abgleich mit den Projektwerten statt (kommt spaeter als Ampel).
    Fehlt eine Vorgabe im Plan, wird sie weggelassen. Ist kein B-Plan ausgewertet,
    erscheint die Karte gar nicht.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Gelaendebruecke"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Geländebrücke"
    - "Aushub berechnen"
    - "wie viel Erde muss weg"
    - "Cut Fill"
    - "Abtrag Auftrag"
    - "Aushubtiefe"
    - "DXF auswerten"
  antwort: |
    Die Karte "Geländebrücke" (in "Plaene & Unterlagen") schaetzt aus einem
    Vermessungs-DXF den Erdaushub:
    1. "DXF auswerten" tippen, das Bestands-DXF (Höhenpunkte/-linien) waehlen.
    2. Optional OK-Bodenplatte fest vorgeben; leer = Auto (Massenausgleich).
    3. Ergebnis: Abtrag/Auftrag (m³), Schotter (t), LKW-Fuhren, und die
       "Max. Aushubtiefe" (hoechster Gelaendepunkt minus OK-Bodenplatte).
    4. Ist ein Bebauungsplan mit "Abgrabung max." ausgewertet, zeigt eine
       gruene/rote Ampel, ob die Aushubtiefe im erlaubten Rahmen bleibt.
    5. "Ins LV uebernehmen" schreibt die Mengen als Positionen (geschaetzt);
       "PDF-Report" erzeugt einen Aushub-Bericht.

    WICHTIG: Das DXF braucht ein eingezeichnetes geplantes Haus (Layer
    "Geplante Hauslage" o. ä.) - sonst meldet es "kein geplantes Haus" und
    kann den Aushub nicht rechnen. Fehlt das Haus, erscheint der Knopf
    "Hauslage platzieren" (siehe App_Hauslage_Platzieren). Es ist eine
    Planungs-Schaetzung, ersetzt NICHT Vermesser oder Bodengutachten.
  quelle_kurz: "iMOPS App-Bedienung (Welle 7)"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Hauslage_Platzieren"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Hauslage platzieren"
    - "kein geplantes Haus"
    - "kein Haus im DXF"
    - "Haus fehlt im Plan"
    - "Grundstueck anzeigen"
    - "Grundstuecksgrenzen"
    - "Haus selbst einzeichnen"
  antwort: |
    Meldet die Geländebrücke "kein geplantes Haus", erscheint darunter der Knopf
    "Hauslage platzieren". Er zeigt das Grundstueck aus demselben DXF, das schon
    geladen ist - Grundstuecksgrenzen und Gelaende-Ausdehnung, massstaeblich
    eingepasst. Es wird NICHT neu hochgeladen.

    So gehst du vor: das Haus vom Lageplan (PDF-Draufsicht) abgreifen und die
    Ecken der Reihe nach auf das Grundstueck tippen - Grenze und Gitter sind dein
    Bezug. Live siehst du Flaeche (m2) und Laenge x Breite, damit du gegen die
    Masse vom PDF pruefen kannst. "Letzte zurueck" und "Neu" korrigieren.

    Ab drei Ecken rechnet "Aushub rechnen": die App schickt die Ecken als
    footprint (in DXF-Koordinaten) an die Box, die daraus Cut/Fill, Schotter (t)
    und LKW-Fuhren rechnet - genau wie bei einem Haus, das im DXF steht. Das
    Ergebnis erscheint dann in der Geländebrücke-Karte mit "Ins LV uebernehmen"
    und "PDF-Report". Ein OK-BP-Wert aus der Karte wird mitgenommen.

    So wird ein haus-loser Vermessungsplan rechenbar, ohne Architekten-DXF.
    Es funktioniert mit DXF und DWG - der Dateiname wird mitgeschickt, damit die
    Box eine DWG vorher wandelt. Ehrlich: Schaetzung aus euren Stuetzpunkten, und
    WO das Haus liegt, aendert die Aushubtiefe - sauber vom Lageplan abgreifen.
  quelle_kurz: "iMOPS App-Bedienung (Welle 7, Schritt 2b)"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Ist_Uebersicht"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Ist-Übersicht"
    - "Baustellen-Übersicht"
    - "Ist-Kosten"
    - "echte LV-Daten anzeigen"
    - "Übersicht aus importierten Daten"
    - "Wo sehe ich die echten Kosten der Baustelle"
  antwort: |
    Die Ist-Übersicht zeigt die Baustelle aus den ECHTEN importierten LV-Daten
    (nicht die Planer-Schaetzung):
    1. Baustelle oeffnen -> oben die Karte "Baustellen-Übersicht" -> "Ist-Übersicht"
       antippen. Die Karte erscheint automatisch: sind LV-Daten da, fuehrt sie in die
       Ist-Übersicht (darunter ein kleiner Link "Gegen Kennwert pruefen", der das
       kalkulierte LV der Schaetzung gegenueberstellt und von dort auch in den Planer
       fuehrt); ist die Baustelle leer, bietet sie stattdessen das Planen (Soll) an.
    2. Kopf: Projekt/Baustelle/Quelldatei aus dem Import + Positionsanzahl, Netto, Brutto.
       Sind Unterlagen ausgewertet UND gespeichert (Karte "Unterlagen auswerten"), zeigt
       der Kopf zusaetzlich Kern-Fakten als Chips: Bodenklasse, Wohnflaeche, Zone/GRZ,
       Anzahl Erschliessungs-Medien.
    3. Reiter:
       - Kosten: nach DIN-276-Kostengruppe (Netto/MwSt/Brutto).
       - Massen: nach LV-Titel (fuehrende Positionsnummer), Menge + Einheit je Position.
       - Material: Positionen mit Artikel-Nr./Lieferant (bei Statik-/Bestell-Import gefuellt).
       - Zeitplan: Bauzeitraum (Start/Ende) + eigene Bauphasen anlegen (Name/Gewerk +
         Start/Ende) als Terminplan; Balken = Zeit-Fortschritt der Phase. Antippen = bearbeiten,
         Wischen = loeschen. (Bauzeitraum-Termine selbst setzt du ueber "Bearbeiten".)

    Unterschied zur "Soll-Übersicht": die Soll-Übersicht ist die Planer-Schaetzung
    (Angebot), die Ist-Übersicht sind die tatsaechlich importierten Daten. Geschaetzte
    Mengen sind mit "geschaetzt" markiert (gemessen verdraengt geschaetzt).
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_LV_Element_Kalkulation"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "B-Element"
    - "Element rechnen"
    - "Element kalkulieren"
    - "Einheitspreis aus mehreren Positionen"
    - "Preis je Quadratmeter aus Arbeitsschritten"
    - "Rezept-Mass"
    - "Bausteine summieren"
    - "Deckel summiert Bausteine"
    - "Arbeitsschritte zu einem Preis zusammenfassen"
  antwort: |
    Ein Deckel im LV kann ZWEI verschiedene Dinge sein. Umschalten: lange auf den
    Deckel druecken (Rechtsklick am Mac) -> "Als Element rechnen" bzw. "Wieder als
    Mengentraeger rechnen".

    1) Mengentraeger (Vorgabe, orange): der Deckel traegt die Menge, die Unterpunkte
       sind Beleg und "zaehlen nicht". So kommen Excel- und Bestelllisten-Importe herein.

    2) Element (indigo): der Deckel ist die SUMME seiner Bausteine. Beispiel Pflaster:
       Untergrund, Frostschutz, Bettung, Verlegen, Schneiden, Einsanden, Abruetteln,
       Nacharbeiten - am Ende steht ein Einheitspreis, z.B. 87,00 EUR/m².

    So legst du ein Element an:
    - Positionen im LV auswaehlen und gruppieren (der Deckel entsteht).
    - Deckel lange druecken -> "Als Element rechnen".
    - Am Deckel Bezugsmenge und Einheit setzen (z.B. 100 m²) - ueber "Bearbeiten".
    - Je Baustein antippen -> "Bearbeiten" -> Feld "Rezept-Mass": wie viel je Einheit
      des Elements gebraucht wird, z.B. 0,35 m³ Schotter je m² Pflaster. Die Vorschau
      zeigt sofort die tatsaechliche Menge (0,35 x 100 = 35 m³).
    - In jedem Baustein wie gewohnt Material, Lohn und Geraet kalkulieren.

    Wichtig: Zuschlaege (BGK, Wagnis & Gewinn) werden EINMAL oben am Element
    gerechnet, nicht je Baustein - sonst wuerde doppelt aufgeschlagen. Die
    Zuschlagsfelder eines Bausteins bleiben deshalb ohne Wirkung, solange er unter
    einem Element haengt.

    Vorteil: das Element ist ein Rezept. Aendert sich die Flaeche, bleibt der Preis
    je m² gleich und die Gesamtsumme rechnet sich neu. Die Bausteine duerfen dabei
    in anderen Einheiten rechnen als das Element (m³, lfm, Stunden) - die Umrechnung
    macht das Rezept-Mass.

    "Aufloesen" macht aus der Gruppe wieder Einzelpositionen und setzt den Deckel
    auf Mengentraeger zurueck.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Zuschlag_Je_Kostenart"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Zuschlag je Kostenart"
    - "Zuschlag auf Lohn"
    - "Lohnzuschlag"
    - "unterschiedliche Zuschlaege"
    - "Zuschlagsgruppen"
    - "Faktor auf den Lohn"
    - "Gemeinkosten auf Lohn"
    - "Lohnstunden"
    - "Mannstunden"
    - "wie viele Stunden steckt im Angebot"
  antwort: |
    WO DIE SAETZE STEHEN: unter Einstellungen -> "Kalkulation — Zuschlaege". Dort
    einmal gepflegt, gelten sie fuer JEDE Position, die nicht ausdruecklich abweicht.
    Wer eine einzelne Position anders rechnen will, schaltet in der Tiefenkalkulation
    "Von den Firmenwerten abweichen" ein — dann werden die Regler dort bedienbar und
    gelten nur fuer diese eine Position. Solange der Schalter aus ist, zeigen die
    Regler die Firmenwerte grau an, damit sichtbar ist, womit gerechnet wird.

    Beim Umschalten auf "abweichen" werden die aktuellen Firmenwerte uebernommen —
    der Preis springt also nicht, nur weil man "abweichen" antippt.

    Ausserdem gibt es den Schalter "Je Kostenart aufschlagen".

    AUS (Vorgabe): ein Satz Wagnis & Gewinn und ein Satz BGK, beide auf die
    Selbstkosten. So war es immer.

    AN: je Kostenart ein eigener Satz — Lohn, Material, Geraet getrennt. Das
    entspricht der ueblichen Praxis: der Lohn traegt den Loewenanteil von
    Gemeinkosten und Gewinn, Material und Geraet kaum etwas. Groessenordnungen aus
    der Praxis: Lohn mal 2,75 (also 175 %), Material mal 1,15, Geraet mal 1,10.
    W&G und BGK werden in diesem Modus NICHT zusaetzlich gerechnet.

    Wichtig: das Umschalten allein aendert keinen Preis. Die drei Saetze starten bei
    je 20 % — das ist dieselbe Summe wie 12 % BGK + 8 % W&G auf alles. Erst wer an
    einem Regler dreht, veraendert die Zahl.

    Jeder Regler zeigt beides: den Prozentsatz und den Faktor (175 % = x2,75). Im
    Ergebnis steht der Aufschlag dann dort, wo er entsteht — so siehst du, dass der
    Lohn das Geld traegt.

    Beim B-Element gilt der Zuschlag am Element, nicht an den Bausteinen. Ein
    Baustein rechnet immer zuschlagsfrei, egal was an ihm eingestellt ist.

    LOHNSTUNDEN: unten im LV steht neben der Angebotssumme, wie viele Lohnstunden
    das ganze Angebot bedeutet — die Groesse, an der Termine und Mannschaftsstaerke
    haengen. In der Tiefenkalkulation stehen sie je Position (gesamt und je Einheit).
    Geraetestunden zaehlen NICHT mit: die Maschine steht auch, wenn niemand
    danebensteht. Belege unter einem Deckel zaehlen nicht doppelt.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Kennwert_Vergleich"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Gegen Kennwert pruefen"
    - "Kennwert-Vergleich"
    - "Kennwert je qm"
    - "liege ich richtig mit meinem Angebot"
    - "ist mein LV zu billig"
    - "Angebot mit Schaetzung vergleichen"
    - "Soll-Ist-Vergleich Kosten"
    - "Euro pro Quadratmeter"
    - "BKI"
    - "Baukosten pro qm einstellen"
  antwort: |
    WO: Baustelle oeffnen -> Karte "Baustellen-Übersicht" -> darunter der kleine Link
    "Gegen Kennwert pruefen". Er erscheint erst, wenn LV-Positionen da sind — ohne LV
    gibt es nichts zu vergleichen.

    WAS DA VERGLICHEN WIRD: das kalkulierte LV gegen die Grobkostenschaetzung aus dem
    Planer (Wohnflaeche x Kennwert, verteilt auf die Gewerke) — aber NUR fuer die
    Gewerke, die dein LV ueberhaupt abdeckt. Die Schaetzung rechnet das ganze Haus
    inklusive Sanitaer, Heizung und Maler; ein LV deckt meist nur die eigene Leistung
    ab. Beide Gesamtsummen nebeneinander zu stellen, liest sich wie "weit unter Plan"
    und waere ein Vergleich, den es nicht gibt. Was nicht im LV steckt, wird darum
    ausdruecklich als "Nicht im LV — nicht mitgerechnet" aufgezaehlt statt stillschweigend
    weggelassen.

    KEINE FARBEN, KEIN URTEIL: unter dem Kennwert zu liegen ist kein Erfolg. Es kann
    genauso heissen, dass etwas vergessen wurde. Die Ansicht zeigt die Abweichung, das
    Urteil bleibt beim Menschen.

    WOHER DER KENNWERT KOMMT: aus Einstellungen -> "Kalkulation — Kennwerte je m²",
    drei Werte fuer einfach / mittel / gehoben (Vorgabe 2000 / 2500 / 3200 EUR je m²).
    Ein leeres Feld faellt auf die Vorgabe zurueck, damit eine versehentliche 0 nicht
    die ganze Schaetzung auf null zieht. Welcher der drei gilt, entscheidet das
    Ausstattungsniveau im Planer.

    ⚠️ Das sind EURE Erfahrungswerte, KEINE lizenzierten BKI-Daten. Echte
    BKI-Kennwerte kommen vom Baukosteninformationszentrum und sind kostenpflichtig;
    die App behauptet diese Quelle nicht — darum heisst es "Kennwert" und nicht "BKI".
    Auch die Verteilung auf die Gewerke ist eine Faustformel. Geschaetzt ist ein anderer
    Zustand als gemessen: der Vergleich taugt fuer die Groessenordnung, nicht als
    Nachweis.

    STEHT NICHTS DA? Dann ist im Planer fuer diese Baustelle noch nichts konfiguriert.
    Die Ansicht sagt das und bietet "Planer oeffnen" an.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Grap8_Leinwand"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Grap8"
    - "Leinwand"
    - "Kausalkette ansehen"
    - "Was ist Grap8"
    - "Abhaengigkeiten sehen"
    - "Wer wartet auf wen"
  antwort: |
    Grap8 zeigt die Auftraege einer Baustelle als Flaeche mit Kaesten und Pfeilen —
    wer auf wen wartet.

    So oeffnest du sie:
    1. Tab "Baustellen"
    2. Oben rechts das "..."-Menue antippen
    3. "Grap8" waehlen
    4. Baustelle aus der Liste antippen (die Zahl dahinter sagt, wie viele
       Auftraege dranhaengen)
    5. "Fertig" oben rechts schliesst die Leinwand, "Baustelle" oben links
       wechselt zu einer anderen

    Was du siehst: je ein Kasten pro Auftrag mit Name, Kostengruppe und Zustand
    (offen / in Arbeit / erledigt). Ein Auftrag, dessen Vorgaenger alle fertig
    sind, wird als "startklar" gezeigt; fehlt noch einer, steht "wartet".

    WICHTIG — die Leinwand ist derzeit NUR ANSICHT. Sie liest die Auftraege aus
    der App; was du dort anklickst oder verschiebst, wird NICHT gespeichert und
    ist nach dem Schliessen weg. Aendern kannst du einen Auftrag nur in der
    Baustelle selbst.

    Pfeile erscheinen, sobald du Auftraege verknuepft hast. Das machst du im
    Auftrag selbst unter "Wartet auf" — siehe "Voraussetzung setzen".

- id: "App_Voraussetzung_setzen"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Voraussetzung setzen"
    - "Auftraege verknuepfen"
    - "Wartet auf"
    - "Reihenfolge festlegen"
    - "Vorgewerk festlegen"
    - "Auftrag haengt von anderem ab"
  antwort: |
    Festlegen, dass ein Auftrag auf einen anderen warten muss:
    1. Baustelle oeffnen, den Auftrag antippen
    2. Abschnitt "Wartet auf" (unten in der Auftragsansicht)
    3. Auf "+" tippen
    4. Aus der Liste den Auftrag waehlen, der VORHER fertig sein muss
       (es erscheinen nur Auftraege derselben Baustelle, die noch nicht
       verknuepft sind)

    Wieder loesen: in der Zeile auf das rote Minus tippen.

    Was du siehst: ein gruener Haken heisst, der Vorgaenger ist fertig; eine
    orange Uhr heisst, er laeuft noch. Der Auftrag gilt als startklar, sobald
    alle Vorgaenger fertig sind — das rechnet die App live, du musst nichts
    abhaken.

    Kreis nicht moeglich: Wenn A auf B wartet, kann B nicht auch auf A warten —
    dann koennte keiner von beiden je anfangen. Die App lehnt das mit einer
    Meldung ab und nennt beide Auftraege beim Namen. Das gilt auch ueber
    Zwischenschritte (A wartet auf B, B auf C, C kann nicht auf A warten).

    Die Verknuepfungen sind dasselbe, was Grap8 als Pfeile zeichnet.

- id: "App_Aushub_aus_zwei_DXF"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Aushub aus DXF"
    - "Aushub rechnen"
    - "zwei DXF"
    - "Gelaendeplan ohne Haus"
    - "Zeichnung mit Haus"
    - "Baugrube rechnen"
    - "Aushubsohle"
    - "Hoehenanker"
    - "Zollfalle SketchUp"
    - "Massstab DXF"
  antwort: |
    "Aushub aus DXF" rechnet die Baugrube aus ZWEI Zeichnungen, die sich ergaenzen:
    dem Gelaendeplan OHNE Haus (die Hoehen) und der Grundstueckszeichnung MIT Haus
    (der Umriss). Beide muessen aus demselben Koordinatensystem kommen.

    Wo: Baustelle oeffnen -> "Erdmassen aus Gelaende" -> Knopf
    "Aushub aus zwei DXF (Gelaende + Haus)". Rechnet offline im Mops, ohne Server.

    So gehst du vor:
    1. Gelaende-DXF waehlen. Der Mops loest verschachtelte Bloecke selbst auf.
    2. Massstab bestaetigen. Spannt das Modell nur ein paar Einheiten, ist es die
       SketchUp-Zollfalle (1 Einheit = 39,37 m) - der Mops schlaegt das vor, rechnet
       aber NICHT heimlich um. Darunter steht, wie gross das Grundstueck damit waere.
    3. Haus-DXF waehlen. Der Umriss kommt aus den Wand-Layern; ueber die Auswahl
       "Umriss aus" laesst sich auch ein anderer Layer nehmen (z. B. nur die Garage).
    4. Hoehenanker setzen: Rohfussboden EG in mueNN aus dem Werkplan eintragen und
       dazu, auf welchem Z das Modell die OK Bodenplatte hat ("Wandfuss aus der
       Hauszeichnung uebernehmen" macht das automatisch). Liegt das Gelaende schon
       in mueNN, den Schalter oben umlegen.
    5. Aufbau pruefen: Bodenaufbau, Plattendicke, Polster, Arbeitsraum. Daraus wird
       die Aushubsohle: Rohfussboden minus Bodenaufbau minus Platte minus Polster.
    6. "Aushub rechnen" -> Abtrag/Auftrag, Flaeche, Gelaende von/bis, mittlere Tiefe.
    7. "Aushub ins LV uebernehmen" schreibt die Position mit dem ganzen Rechenweg
       in den Langtext.

    Gegenprobe (wichtig): nach dem Anker zeigt das Ergebnis die Gelaendespanne in
    mueNN. Die gegen einen bekannten Wert halten - Strassenhoehe, Nachbarhoehe,
    Hoehe aus dem Lageplan. Passt die nicht, stimmt der Anker nicht.

    EHRLICH: das ist ein geometrisches Volumen im gewachsenen Zustand - ohne
    Auflockerung, ohne Boeschungsausrundung, kein Vermesser-Aufmass. Rasterzellen
    ausserhalb des Gelaendemodells werden gezaehlt und angezeigt.
  quelle_kurz: "iMOPS AushubAusDXFView"

- id: "App_Mops_fass_Ampel"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Mops fass"
    - "Ampel rot gelb gruen"
    - "warum ist die Position rot"
    - "Summe stimmt nicht"
    - "Preis wird nicht angezeigt"
    - "importierter Preis weg"
  antwort: |
    "Mops fass" geht ueber alle LV-Positionen, sucht das Rezept, rechnet den
    Einheitspreis und stellt eine Ampel:

    GRUEN  - der Preis steht. Entweder liegt ein hinterlegter Einheitspreis vor
             (aus einem importierten GAEB-X84, aus dem Firma-Preis-Katalog oder von
             einem Lieferanten) oder das Rezept ist vollstaendig durchgerechnet.
             Bei einem hinterlegten Preis steht in der Meldung, von wem er kommt.
    GELB   - Rezept oder Richtwert da, aber ein Wert fehlt (Material, Aufwandswert)
             oder es steckt eine ungepruefte KI-Schaetzung drin.
    ROT    - kein Rezept, kein Richtwert, kein Preis. Ehrliche Luecke, keine
             erfundene Zahl.

    WICHTIG - Rangfolge der Preise, ueberall gleich:
    hinterlegter Preis (Angebot) schlaegt Element-Kalkulation schlaegt
    Eigenkalkulation. Ein importierter Angebotspreis bleibt also stehen, auch wenn
    spaeter noch Lohnstunden dazukommen. Die Lohnstunden werden trotzdem gematcht -
    sie sind das Zeitgeruest fuer Termine und Mannschaft, nicht der Preis.

    Steht unten eine viel zu kleine Summe, obwohl Preise importiert wurden: die
    Kostenuebersicht gegenpruefen. Zeigt die den richtigen Betrag, sind die Preise da.
  quelle_kurz: "iMOPS AutoKalkulationsService, LVKalkulator.effektiverEP"

- id: "App_Canvas_Rechnung"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Rechnung im Canvas"
    - "Rechnung ganze Baustelle"
    - "Endpreis Canvas"
    - "Angebotssumme Canvas"
    - "Rechnung aufklappen"
    - "Selbstkosten und Aufschlaege"
  antwort: |
    Die Rechnungskarte unten rechts im Canvas zeigt zwei verschiedene Dinge -
    das ist Absicht:

    ANGEBOTSSUMME (netto) - immer sichtbar, oben.
    Das ist der Endpreis, der auch im LV, im PDF und im GAEB-Export steht.
    Alle rechnen ueber dieselbe Rangfolge: hinterlegter Preis vor Element vor
    Eigenkalkulation.

    Auf die Karte tippen klappt sie auf. Dann kommen dazu:
    - "Woraus der Preis kommt": wie viel aus hinterlegten Preisen (GAEB-Import,
      Firma-Katalog, Lieferantenangebot) und wie viel aus eigener Kalkulation.
    - "Was es den Betrieb kostet": Material + Lohn + Geraet = Selbstkosten,
      dazu die Aufschlaege (BGK, AGK, Wagnis und Gewinn).
      Material/Lohn/Geraet sind antippbar - dann sieht man, welche Positionen
      den Betrag treiben (groesste zuerst, gut zum Ausreisser-Suchen).

    WICHTIG: Bei Positionen mit hinterlegtem Preis gibt es keine Material/Lohn/
    Geraet-Aufteilung. Der Preis IST der Preis. Der Unterschied zwischen
    Angebotssumme und Selbstkosten ist die Marge - kein Fehler.

    Die Karte merkt sich, ob sie auf- oder zugeklappt war.
  quelle_kurz: "iMOPS CanvasRechnungBox, LVKalkulator.gesamtAufschluesselung"

- id: "App_GAEB_Ankunftsbericht"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Ankunfts-Bericht"
    - "Preise fehlen nach GAEB-Import"
    - "Wo sind meine Preise"
    - "Import fertig aber keine Preise"
    - "Summe stimmt nicht nach Import"
    - "Preise verschwunden"
  antwort: |
    Nach dem Import einer GAEB-Datei MIT Preisen (DP 84 / X84) kommt kein blankes
    "Import fertig" mehr, sondern der Ankunfts-Bericht. Er liest zurueck, was
    wirklich in der Baustelle liegt - ueber denselben Weg, den das LV und die
    Angebotssumme gehen.

    Was er zeigt:
    - Positionen uebernommen
    - Preise in der Datei / davon jetzt abrufbar
    - Summenprobe: Summe in der Datei gegen Summe in der Baustelle
    - bei Luecken: jede betroffene Position, teuerste zuerst, mit Fehlbetrag

    GRUEN = Soll und Ist stimmen ueberein, man darf weiterrechnen.
    ROT = Preise standen in der Datei und sind nicht angekommen. Dann NICHT
    weiterrechnen: die Baustelle wuerde mit einer zu niedrigen Summe arbeiten.
    Das ist ein Fehler im Import, nicht in der Datei - bitte melden.

    Warum es das gibt: am 20.09.2026 hat ein Import 109 Positionen angelegt und
    "fertig" gemeldet, obwohl KEINER der 109 Preise (263.304,97 EUR) angekommen
    war. Aufgefallen ist es erst, weil die Endsumme im LV komisch aussah.
  quelle_kurz: "iMOPS GAEBAnkunftsPruefung, GAEBAnkunftsBerichtView"

- id: "App_GAEB_Import_haengt_an"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Positionen doppelt nach Import"
    - "LV doppelt"
    - "GAEB zweimal importiert"
    - "Alte Positionen loeschen vor Import"
    - "Import ersetzt nicht"
  antwort: |
    Ein GAEB-Import HAENGT AN, er ersetzt das vorhandene LV NICHT. Hat die
    Baustelle schon Positionen, steht im Import-Fenster oben eine orange Warnung
    mit der Anzahl.

    Soll das neue LV den alten Stand abloesen, VORHER die alten Positionen
    loeschen. Sonst steht alles doppelt in der Summe, und die Endsumme ist eine
    Mischung aus zwei Staenden - nicht nachvollziehbar.

    So leert man das alte LV, OHNE die Baustelle zu verlieren:
    In der Baustelle auf die LV-Karte rechtsklicken (Laptop) bzw. lange druecken
    (iPad) -> "Gesamtes LV loeschen" -> GOAT-PIN eingeben -> "LV LEEREN".
    Maengel, Bautagesberichte und Aufmasse bleiben erhalten, nur die
    LV-Positionen gehen weg.

    Einzelne Positionen loeschen geht im LV ueber Wischen nach links, Rechtsklick
    oder den Dialog beim Antippen der Zeile - jeweils mit Rueckfrage. Mehrere auf
    einmal geht ueber die Auswahl NICHT (die kann nur "Zusammenfuehren").

    Der Knopf "Duplikate entfernen" hilft hier meist NICHT: er vergleicht
    Bezeichnung + Einheit + Menge. Stammen die doppelten Positionen aus zwei
    verschiedenen Import-Staenden, sind die Texte leicht anders geschrieben - dann
    findet er nichts, obwohl die Positionsnummern doppelt sind.

    Merkhilfe: importieren = dazulegen, nicht austauschen.
  quelle_kurz: "iMOPS GAEBImportView, GAEBAnkunftsPruefung.bestandVorImport"

