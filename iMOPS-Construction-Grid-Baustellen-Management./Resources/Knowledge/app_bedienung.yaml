- id: "App_XRechnung_fehlende_Preise"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "XRechnung exportieren"
    - "Rechnung exportieren"
    - "XRechnung geht nicht"
    - "Export nicht möglich fehlende Preise"
    - "Warum kann ich keine XRechnung erstellen"
    - "Position ohne Preis Export"
  antwort: |
    XRechnung-Export und fehlende Preise:

    Der XRechnung-Export wird BLOCKIERT, sobald mindestens eine Position
    keinen Preis hat. "Kein Preis" heißt: weder ein Angebot im
    Angebotsvergleich noch eine hinterlegte Kalkulation (Tiefenkalkulation
    oder Pauschal-/NU-Träger). Das verhindert versehentliche Rechnungen
    mit 0,00-€-Positionen.

    Meldung "Export nicht möglich – fehlende Preise":
    1. Im LV die betroffene Position öffnen
    2. Entweder im Angebotsvergleich (⋯ → Angebotsvergleich) einen Preis
       erfassen ODER die Position kalkulieren (⋯ → Kalkulation)
    3. Export erneut starten

    Unterschied zu GAEB X84: Der GAEB-Export warnt nur und lässt sich mit
    "Trotzdem exportieren" fortsetzen (leere EP-Felder sind dort zulässig,
    z.B. für eine Angebotsaufforderung). Die XRechnung dagegen blockt hart.

    Der angesetzte Einzelpreis ist überall derselbe (eine Wahrheit):
    günstigstes Angebot, sonst kalkulierter VK-Preis, sonst 0.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Globale_Suche"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Suche"
    - "Globale Suche"
    - "Wie suche ich"
    - "Alle LVs anzeigen"
    - "Leistungsverzeichnisse finden"
    - "Position suchen"
  antwort: |
    Der Tab "Suche" durchsucht die ganze App auf einmal (ab 2 Zeichen):
    - Baustellen (Titel, Ort, Bauherr)
    - LV-Positionen (Bezeichnung, Artikel-Nr, Pos-Nr)
    - Maengel (Titel, Beschreibung, Ort, Gewerk)
    - Katalog (Name, Code, Kategorie)
    - Auftraege (Mitarbeiter, Kostengruppe, Details, Lagerort)

    Treffer kommen in Abschnitten und sind antippbar — eine LV-Position
    springt direkt ins LV der zugehoerigen Baustelle.

    Unten die Kategorie-Chips (Alle / Baustellen / LV / Maengel / Katalog /
    Auftraege) grenzen ein. Tipp: Chip "LV" bei leerem Suchfeld listet
    ALLE Leistungsverzeichnisse (pro Baustelle) zum Durchspringen.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Unterlagen_auswerten"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Unterlagen auswerten"
    - "Dokument auswerten"
    - "Bodengutachten auswerten"
    - "Wohnflaeche auslesen"
    - "Bebauungsplan auslesen"
    - "Erschliessung auslesen"
    - "PDF Fakten herausziehen"
    - "Wo werte ich Unterlagen aus"
  antwort: |
    In einer Baustelle gibt es die Karte "Unterlagen auswerten" (zwischen
    "Plaene & CAD" und "Material").
    1. Button "Auswerten" tippen
    2. Ein oder mehrere Text-PDFs waehlen (Mehrfachauswahl erlaubt)
    3. Der Mops liest die Textebene und zieht die LV-relevanten Fakten heraus:
       - Bodengutachten (Bodenklassen, Frosttiefe, Grundwasser, Abdichtung)
       - Wohnflaechen-/Rauminhaltsberechnung (m2 je Raum, BRI)
       - Bebauungsplan (GRZ/GFZ, Hoehen, Dach, Erdarbeiten)
       - Erschliessung (Medien/Dimensionen, Warnungen z.B. 20-kV-Leitung)
    4. Das Ergebnis oeffnet sich als Liste zum Pruefen ("Ergebnis ansehen").

    WICHTIG: Das ist ein KI-Entwurf aus der PDF-Textebene, kein Gutachten und
    kein Vermesser-Ergebnis — vor Verwendung pruefen. Reine Zeichnungen ohne
    Textebene werden uebersprungen (die gehoeren zur Vision-Auswertung).
    Braucht Verbindung zum Mops-Server (wie die Plan-Auswertung).
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"
