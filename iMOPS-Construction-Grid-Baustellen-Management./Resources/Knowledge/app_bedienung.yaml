# iMOPS App-Bedienung — deterministische Hilfe-Texte
#
# Diese Eintraege beschreiben WIE die App bedient wird (Buttons, Tabs, Workflows).
# Sie sind kategorie: "app-bedienung" — die UI zeigt sie mit einem "Bedienungshilfe"-
# Icon statt dem Bau-Wissen-Icon an.
#
# WICHTIG (Drift-Falle): Wenn sich die App aendert (neue Buttons, umbenannte Tabs,
# neue Workflows), MUSS dieser File mit-aktualisiert werden. Sonst erklaert der
# Mops Bedienung die es nicht mehr gibt. Siehe CONTRIBUTING.md.
#
# Pflege-Regel: bei jedem PR der UI-Views aendert pruefen ob hier was aktualisiert
# werden muss. app_version_min hilft alte Eintraege zu erkennen.

- id: "App_Baustelle_anlegen"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Baustelle anlegen"
    - "Neue Baustelle"
    - "Event anlegen"
    - "Wie lege ich eine Baustelle an"
    - "Wie erstelle ich eine Baustelle"
  antwort: |
    Eine neue Baustelle anlegen:
    1. Tab "Baustellen" oeffnen (unten links)
    2. Plus-Button oben rechts antippen
    3. Pflichtfelder: Titel, Bauherr, Architekt, Baugenehmigungs-Nr.
    4. Optional: Ort, Start-/Endzeit, Notizen
    5. "Sichern" tippt die Baustelle in die Liste

    Die Baustelle ist danach im Tab "Baustellen" auswaehlbar und enthaelt
    LV, Mengen, Maengel, Aufmasse und Bautagesberichte.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Auftrag_anlegen"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Auftrag anlegen"
    - "Neuer Auftrag"
    - "Wie lege ich einen Auftrag an"
    - "Job anlegen"
  antwort: |
    Einen Auftrag (Job) zu einer Baustelle anlegen:
    1. Baustelle aus der Liste oeffnen
    2. In der Detail-Ansicht zum Bereich "Auftraege" scrollen
    3. Plus-Button im Auftraege-Header tippen
    4. Aus Vorlage waehlen (Rohbau, Elektrik, Sanitaer, ...) oder leer starten
    5. Checkliste, Mitarbeiter und Geraete zuordnen
    6. "Sichern"

    Auftraege folgen dem Status: Offen -> In Arbeit -> Erledigt -> Abgenommen.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_GAEB_Import"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "GAEB Import"
    - "GAEB importieren"
    - "X83 importieren"
    - "X84 importieren"
    - "LV importieren"
    - "Wie importiere ich GAEB"
  antwort: |
    GAEB-Datei (.x83 / .x84 / .x86) in eine Baustelle importieren:
    1. Datei auf das iPad ziehen (Drag-and-Drop) oder ueber Files-App teilen
    2. iMOPS erkennt den Dateityp automatisch (FileInspector oeffnet sich)
    3. Mops klassifiziert die Datei zusaetzlich per KI (Brain-Icon)
    4. Button "In LV importieren" tippen
    5. Im EventPicker die Ziel-Baustelle waehlen
    6. Positionen pruefen und finale Mengen bestaetigen
    7. "Importieren" -> Positionen sind im LV der Baustelle

    Unterstuetzt: GAEB DA XML 3.2 und 3.3.
  quelle_kurz: "iMOPS App-Bedienung (Phase 5c)"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Statik_Mops_Import"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Statik importieren"
    - "Statik per Mops"
    - "Plan auswerten"
    - "Bestellung aus Statik"
    - "Mat-Nr aus Plan"
    - "Wie werte ich eine Statik aus"
  antwort: |
    Statik-/Bewehrungsplan vom Mops auswerten lassen (Mengen + Kostengruppe + Mat-Nr):
    1. In einer Baustelle "LV aus PDF importieren" oeffnen
    2. Button "Statik per Mops auswerten" tippen (blau)
    3. Die Plan-PDF(s) (Statik oder Bewehrung) waehlen — mehrere gleichzeitig moeglich
    4. Der Mops liest die Plaene nacheinander auf der Box (kann dauern, CPU-only)
    5. Positionen pruefen/abwaehlen — inkl. erkannter Kostengruppe und Xella-Mat-Nr
    6. "Importieren" -> Positionen sind im LV der Baustelle

    Unterschied zu "PDFs auswaehlen": der lokale Import liest einfache LV-PDFs auf
    dem Geraet; "Statik per Mops" wertet echte Statik-/Bewehrungsplaene aus und
    schlaegt Material-Nummern vor (abZ-Aufloesung).

    Mehrere PDFs: Beim Auswaehlen koennen mehrere Dateien auf einmal markiert und
    zu einem LV zusammengefuehrt werden. Ueber "PDF hinzufuegen" (in der Pruefliste)
    lassen sich weitere PDFs anhaengen, ohne die bereits erkannten Positionen zu
    verlieren. Jede Position merkt sich ihre Quelldatei.

    Doppelte Bewehrung (Plan + Liste liefern dieselbe kg-Menge, z.B. Ringbalken aus
    Ringbalken.pdf UND Ringbalken-Liste.pdf) wird im LV automatisch zu EINER
    aufklappbaren Zeile zusammengefasst ("N Quellen · zählt einmal"). Darunter
    stehen die einzelnen Quell-Positionen; die Angebotssumme zählt die Menge nur
    einmal. Nichts wird geloescht - nur gruppiert dargestellt.
  quelle_kurz: "iMOPS App-Bedienung (Welle 4)"
  license_note: "Eigene Bedienungshilfe"

- id: "App_LV_JSON_Import"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "LV aus JSON"
    - "JSON importieren"
    - "LV aus JSON-Datei"
    - "Town and Country importieren"
    - "Vision-LV importieren"
    - "Wie importiere ich eine LV-JSON"
  antwort: |
    Ein extern erzeugtes LV als JSON-Datei importieren (Format ExtractPlanResult):
    1. In einer Baustelle "LV aus PDF importieren" oeffnen
    2. Button "LV aus JSON-Datei" tippen (gruen)
    3. Eine oder mehrere .json-Dateien waehlen
    4. Positionen pruefen/abwaehlen wie beim PDF-Import
    5. "Importieren" -> Positionen sind im LV der Baustelle

    Wofuer: Manche LV-PDFs (z.B. Town & Country, Export "ComponentOne C1Pdf") haben
    einen kaputten Text-Layer und werden extern per Vision zu JSON gemacht. Dieser
    Weg laedt so eine fertige JSON-Datei direkt in die Pruefliste — ohne den Mops zu
    rufen. Die Datei muss das ExtractPlanResult-Format haben (mindestens lv_positionen).
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Mangel_erfassen"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Mangel erfassen"
    - "Mangel anlegen"
    - "Wie erfasse ich einen Mangel"
    - "Maengelmanagement"
    - "Maengel anlegen"
  antwort: |
    Einen Mangel zur Baustelle erfassen:
    1. Baustelle oeffnen
    2. Bereich "Maengel" -> Plus-Button
    3. Foto aufnehmen (Kamera) oder aus Galerie waehlen
    4. Pflichtfelder: Titel, Gewerk, Schwere (gering/mittel/kritisch)
    5. Optional: Frist, Ort am Bau, verantwortliche Person, DIN-276-KG
    6. "Sichern"

    Bei gesetzter Frist plant iMOPS eine Push-Notification ueber den
    NotificationService. Der Status laesst sich spaeter aendern:
    Offen -> In Arbeit -> Behoben -> Abgenommen.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_BauWissen_und_Prof"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "BauWissen"
    - "Was ist BauWissen"
    - "Wie funktioniert Prof"
    - "Prof-Schalter"
    - "Prof Modus"
    - "Wann nehme ich Prof"
    - "Antwort kopieren"
    - "BauWissen Antwort übernehmen"
  antwort: |
    Der Tab "BauWissen" verbindet die App mit dem Mops-Server fuer
    Bau-Fachfragen. Zwei Modi:

    - Mops (Standard): lokales LLM auf der Mops-Box (llama3.2:3b).
      Schnell genug fuer einfache Fragen, kostenlos, offline-tolerant
      (wenn Server erreichbar). Antwort in 30-120 Sekunden.

    - Prof (Schalter rechts oben): leitet die Frage an den Cloud-Prof
      weiter. Schneller (5-15 Sekunden), gruendlicher bei komplexen
      Fragen, kostet pro Anfrage. Fuer Spezialfaelle wo Mops nicht ausreicht.

    Quellen werden unter jeder Antwort als Karten mit Relevanz-Score
    angezeigt. Lange Antworten koennen ueber "Antwort kopieren" direkt in
    die Zwischenablage gelegt werden.
  quelle_kurz: "iMOPS App-Bedienung (Phase 4)"
  license_note: "Eigene Bedienungshilfe"

- id: "App_LV_PDF_Export"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "LV als PDF"
    - "LV exportieren"
    - "PDF-Export LV"
    - "Wie exportiere ich das LV"
    - "Leistungsverzeichnis PDF"
    - "LV als Excel"
    - "LV als CSV"
    - "Excel-Export"
    - "als Excel schicken"
  antwort: |
    LV einer Baustelle als PDF exportieren:
    1. Baustelle oeffnen
    2. Auf der LV-Karte den PDF-Button (Pfeil nach oben + Dokument)
       tippen — oder oben im Menue "LV als PDF"
    3. PDF wird mit Deckblatt (Projekt, Standort, Datum) + DIN-276
       gruppierten Positionen erzeugt
    4. iOS-ShareSheet oeffnet sich (AirDrop, Mail, Drucken)

    Alternativ: Button "LV als CSV (Excel)" im Menue exportiert die Positionen
    als CSV (RFC-4180) — oeffnet direkt in Excel/Numbers, gut zum Weiterschicken.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_LV_Ansicht_umstellen"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "LV Ansicht umstellen"
    - "LV Dokumentstruktur"
    - "LV nach Dokument sortieren"
    - "LV nach KG anzeigen"
    - "Leistungsverzeichnis Ansicht"
    - "Wo sehe ich die Dokumentstruktur im LV"
  antwort: |
    Die LV-Liste kann in zwei Strukturen angezeigt werden:
    1. Baustelle oeffnen und ins LV gehen
    2. Oben rechts das Drei-Punkte-Menue oeffnen
    3. Unter "Ansicht" zwischen "KG" und "Dokument" wechseln

    "KG" gruppiert die Positionen nach DIN-276-Kostengruppe.
    "Dokument" gruppiert sie nach der Positionsnummer, damit die Liste eher
    wie das importierte LV, Angebot oder die Rechnung gelesen werden kann.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_LV_Bausteine"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "LV Bausteine"
    - "LV-Bausteine auswählen"
    - "Positionen aus Vorlage übernehmen"
    - "Titel Baustelleneinrichtung anlegen"
    - "Standardpositionen ins LV übernehmen"
    - "Eigene LV-Position hinzufügen"
    - "Eigene Position im LV anlegen"
    - "DIN Ebene im LV wählen"
    - "Kostengruppe drei Ebenen"
    - "Fachvorschlag KG"
    - "Expert Validation"
    - "KG Vorschlag übernehmen"
    - "LV Werkbank"
  antwort: |
    LV-Positionen aus lokalen Bausteinen übernehmen:
    1. Baustelle öffnen und ins LV gehen
    2. Oben rechts das Drei-Punkte-Menü öffnen
    3. "LV-Bausteine auswählen" tippen
    4. DIN-Zuordnung in drei Ebenen wählen, z.B.
       200 Vorbereitende Maßnahmen → 210 Herrichten → 211 Sicherungsmaßnahmen
    5. Titel wählen, z.B. "01 Baustelleneinrichtung"
    6. Gewünschte Positionen anhaken
    7. "Übernehmen" tippen

    Eigene Position im selben Sheet anlegen:
    1. Im Abschnitt "Eigene Position" Pos.-Nr., Bezeichnung, Menge,
       Einheit und EP eintragen
    2. "Eigene Position übernehmen" tippen

    Die Bausteine sind Vorlagen. iMOPS übernimmt Positionsnummer, Text, Menge,
    Einheit, EP und die gewählte DIN-Zuordnung. Eigene Positionen werden direkt
    ins LV geschrieben. Menge, Preis und KG danach fachlich prüfen.

    Bei eigenen Positionen und beim Bearbeiten einer LV-Position kann iMOPS lokal
    einen Fachvorschlag für die Kostengruppe anzeigen. Dafür werden nur
    Bezeichnung und Einheit ausgewertet. Der Vorschlag wird erst übernommen, wenn
    der Nutzer aktiv auf "Vorschlag übernehmen" tippt.

    Herkunft der Zahlen: In der LV-Liste trägt jede Position ein kleines
    Herkunfts-Badge, wenn noch geschätzte Werte drinstecken - blau "Richtwert"
    (aus dem Katalog), orange "Startwert", lila "KI geraten". Kein Badge = dein
    Wert / Firmenwert (geprüft). So sieht man auf einen Blick, wo noch eine
    geschätzte Zahl hängt, nicht nur bei KI.

    EK und VK getrennt: Den Grundpreis (EK je Einheit) bearbeitest du im
    "Position bearbeiten"-Dialog (Abschnitt "Grundpreis (EK)"), zusammen mit Text
    und Menge. Den Verkaufspreis (VK) baust du in der Kalkulation auf. Die LV-Liste
    zeigt den EK nur noch an (nicht mehr direkt in der Zeile editierbar); sobald eine
    Tiefenkalkulation existiert, zählt dort der VK.

    Hand-Preise lernen: Ein selbst eingetippter Material- ODER Lohn-Preis wird in
    die Stammdaten übernommen (Material-Katalog bzw. Lohnsätze) und steht beim
    nächsten Mal automatisch zur Auswahl. Geräte-Handpreise lernen (noch) nicht.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_CAD_Viewer"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "CAD Viewer"
    - "3D Modell ansehen"
    - "SKP oeffnen"
    - "USDZ oeffnen"
    - "OBJ ansehen"
  antwort: |
    3D-/CAD-Dateien in iMOPS ansehen:
    1. Datei in die App ziehen (Drag-and-Drop) - unterstuetzt: USDZ,
       OBJ, DAE, FBX, GLTF, GLB, STL, PLY, SKP
    2. FileInspector zeigt Datei-Info, Klassifikation per KI
    3. Bei "3D-Viewer oeffnen" laedt SceneKit das Modell
    4. Drehen mit Finger, Pinch-to-Zoom, Pan zum Verschieben
    5. Reset-Button zurueck zur Ausgangsposition

    SKP-Dateien werden auf dem Server in USDZ konvertiert (kann bei
    grossen Modellen etwas dauern).
  quelle_kurz: "iMOPS App-Bedienung (Phase 5)"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Plaene_Hinzufuegen"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Plaene hinzufuegen"
    - "PDF importieren"
    - "mehrere Plaene auf einmal"
    - "Ordner mit Plaenen"
    - "Plan Datei auswaehlen"
  antwort: |
    Plaene/Dateien zu einer Baustelle hinzufuegen (Karte "Plaene & CAD"):
    1. Baustelle oeffnen, Abschnitt "Plaene & CAD" aufklappen.
    2. Auf Hinzufuegen tippen - der Datei-Picker oeffnet sich.
    3. MEHRERE Dateien auf einmal moeglich: am Mac mit Cmd+A oder
       Cmd-Klick alle markieren, am iPad mehrere antippen, dann
       "Oeffnen". Alle gewaehlten PDFs/Plaene landen in der Karte.
    4. Unterstuetzt: PDF, Bilder, Excel/Word, sowie CAD/3D
       (USDZ, OBJ, DAE, DXF, DWG, IFC, SKP ...).

    Tipp: Raphi kann einen Ordner mit allen Plaenen anlegen; im Picker
    in den Ordner navigieren und alle auf einmal auswaehlen.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_BuildIQ_Scanner"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "BuildIQ"
    - "Was ist BuildIQ"
    - "KI Scanner"
    - "DIN 276 Foto"
    - "Foto Klassifikation"
  antwort: |
    Der Tab "BuildIQ" ist ein KI-Foto-Scanner fuer DIN-276-Kostengruppen.
    Workflow:
    1. Lieferschein oder Bauteil fotografieren
    2. Die Texterkennung laeuft on-device (Apple Vision); der erkannte Text
       geht zur Klassifikation an die Mops-Box (nicht an Google/Gemini)
    3. Antwort: vermutete DIN-276-Kostengruppe + Menge/Einheit + Konfidenz + Begruendung
    4. Mit "Auf Position buchen" das Ergebnis einer LV-Position zuordnen:
       die gescannte Menge wird als Aufmass (Quelle BuildIQ) gebucht und gegen
       die Soll-Menge verglichen (Ampel). Du bestaetigst die Buchung — die KI
       bucht nicht allein. Bei einem Scan ohne erkannte Menge traegst du sie
       von Hand ein.

    Hinweis: Das Foto bleibt auf dem Geraet; nur der erkannte Text geht an die
    Mops-Box im Heimnetz.

    Verfuegbar nur auf iOS (nicht auf macCatalyst).
  quelle_kurz: "iMOPS App-Bedienung (Phase 3)"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Stammdaten_Pflege"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Stammdaten"
    - "Stammdaten pflegen"
    - "Loehne bearbeiten"
    - "Materialpreise pflegen"
    - "Geraete verwalten"
  antwort: |
    Stammdaten sind die app-weiten Kalkulations-Vorlagen: Loehne (Qualifikation +
    Stundenlohn + Zuschlagsfaktor), Materialien (Preis je Einheit) und Geraete
    (Anschaffungskosten + Nutzungsdauer). Daraus zieht die Tiefenkalkulation ihre Werte.

    Oeffnen: im LV ueber das "⋯"-Menue -> "Stammdaten pflegen". Oben umschalten
    zwischen Loehne / Materialien / Geraete. Mit "+" anlegen, Eintrag antippen zum
    Bearbeiten, nach links wischen zum Loeschen.

    Loeschen entfernt nur die Vorlage - bereits kalkulierte LV-Positionen behalten
    ihre Werte (die Position kopiert die Zahlen beim Hinzufuegen, sie referenziert
    die Stammdaten nicht).

    Verfuegbar nur auf iOS (nicht auf macCatalyst).
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Grap8_Knoten_Kalkulation"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Aufwandswert vom Knoten"
    - "Knoten kalkulieren"
    - "Grap8 Kalkulation"
    - "Aufwandswert Vorschlag"
    - "Prof Aufwandswert Grap8"
  antwort: |
    In der Grap8-Leinwand einen Knoten (Auftrag) antippen und im Detailfenster
    "Kalkulation" waehlen. Der Knoten fuehrt jetzt zu seiner EIGENEN LV-Position,
    nicht mehr zur ganzen Baustelle.

    Ablauf: 1) Menge (und Einheit) von Hand eintragen. 2) "Position anlegen" -
    legt die eigene LV-Position dieses Knotens an der Baustelle an, mit dem
    Knoten-Text als Bezeichnung. 3) "Aufwandswert vom Prof holen" - fragt den Prof
    mit dem Knoten-Text nach REFA-Stunden (Maurer/Helfer je Einheit). 4) "In
    Kalkulation uebernehmen" - schreibt die Stunden als Lohnanteile (× Menge ×
    Lohnsatz aus den Stammdaten), NICHT nur als Text. Der Lohn erscheint sofort in
    der Kalkulation; "Tiefenkalkulation oeffnen" zeigt/erweitert sie.

    Der Vorschlag ist ein Richtwert - du entscheidest. Bekommt der Prof keine klare
    Antwort (offline), wird nichts eingetragen und das steht dann da.

    Die "ganze Baustelle" bleibt vom selben Fenster aus erreichbar.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Grap8_Canvas"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Canvas"
    - "Leinwand"
    - "Grap8"
    - "Knoten verschieben"
    - "Preis im Knoten"
    - "Gesamtrechnung Canvas"
    - "Knoten markieren"
  antwort: |
    Die Grap8-Leinwand (Canvas) zeigt die Baustelle als Knoten-Kaesten - jeder
    Knoten ist ein Auftrag/LV-Eintrag. Aufgerufen wird sie im LV ueber "Auf den
    Canvas holen" (danach heisst der Knopf "Canvas ansehen").

    Was man sieht: Jeder Kasten traegt seinen Namen UND den Preis der LV-Position
    dahinter ("Name  ·  8.700 EUR") - so fallen Ausreisser auf einen Blick auf. Der
    Rahmen zeigt die Statusfarbe. Unten rechts steht die kleine Gesamtrechnung der
    ganzen Baustelle (Material + Lohn + Geraet = Selbstkosten, dann Aufschlaege,
    zusammen der Netto-Gesamtpreis); das "?" erklaert die Abkuerzungen.

    Bedienung: Einen Kasten antippen oeffnet rechts sein Detailfenster; Kasten und
    Fenster bekommen dieselbe orange Markierung - man sieht sofort, wo man arbeitet.
    Kaesten lassen sich verschieben; die Anordnung bleibt jetzt gespeichert und ist
    beim naechsten Oeffnen wieder da. "+" oben legt einen neuen Auftrag an (Freier
    Auftrag oder Ketten-Start-Baustein) - dabei entsteht automatisch die passende
    LV-Position, der Auftrag ist also sofort auch im LV sichtbar. Umgekehrt legt "+"
    im LV automatisch einen Canvas-Knoten an. Canvas und LV sind dasselbe Ding, doppelt
    sichtbar: der Canvas zum Planen, das LV zum Durchgehen. Der Sammel-Knopf "Knoten ins
    LV uebernehmen" bleibt fuer aeltere Knoten ohne LV-Position (z.B. aus einem Import),
    "Auf den Canvas holen" umgekehrt fuer importierte LV-Positionen.

    Noch nicht: Umbenennen auf der Leinwand bleibt nicht erhalten.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Ebenen_Freigabe"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Ebenen-Freigabe"
    - "Geschoss freigeben"
    - "Voraussetzungen"
    - "Bau-Hierarchie"
    - "Gebaeude Geschoss"
  antwort: |
    Welle 9 gliedert eine Baustelle in Gebaeude -> Geschosse. LV-Positionen haengen an
    einem Geschoss (Zuordnung im "Position anlegen"-Dialog, Abschnitt "Ebene").

    Verwalten: LV -> "..."-Menue -> "Ebenen verwalten" (Gebaeude/Geschosse anlegen,
    umbenennen, per Drag sortieren, loeschen).

    Freigabe/Status: LV -> "..."-Menue -> "Ebenen-Freigabe / Status". Pro Geschoss:
    - Automatische Voraussetzungen (live berechnet, nur Anzeige): z.B. "keine
      geschaetzten Mengen offen".
    - Manuelle Voraussetzungen (Polier hakt ab): Leistungen erfasst, Aufmass geprueft,
      keine Maengel, Fotodoku, Nachtraege geklaert.
    - Freigabe-Schalter (haelt Datum + Firma fest). Das Gebaeude wird gruen, wenn alle
      seine Geschosse freigegeben sind.

    Wichtig: reine STATUSANZEIGE. Blockiert NICHTS - Bestellungen und Bautagesbericht
    laufen unabhaengig weiter. Die Ampel warnt nur, wenn trotz offener Voraussetzung
    freigegeben wurde.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_IFC_auswerten"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "IFC"
    - "IFC auswerten"
    - "SketchUp Datei einlesen"
    - "SketchUp Mengen"
    - "IFC importieren"
    - "Mengen aus SketchUp"
  antwort: |
    Mengen aus einem SketchUp-Modell holen:
    1. Baustelle oeffnen
    2. Oben rechts "IFC auswerten (SketchUp)"
    3. "IFC-Datei waehlen", dann "Auswerten"

    Die Datei geht an die Mops-Box und kommt geschossweise zurueck: Bauteile
    mit Menge, Material und DIN-276-Kostengruppe, dazu Summen je Geschoss.

    WORAUF DU ACHTEN MUSST - die Zeile unter jeder Menge:
      "aus dem Modell" (gruen) = die Zahl stand so im IFC
      "gerechnet" (orange)     = wir haben sie aus den Maßen geschaetzt
    SketchUp exportiert meist KEINE fertigen Mengen. Dann steht ueberall
    "gerechnet", und die Zahlen sind Naeherungen aus der Geometrie.

    "KG offen" in Orange heisst: die Kostengruppe stand weder im Objektnamen
    noch in der Zuordnungstabelle. Das ist kein Fehler, sondern eine offene
    Frage an den Planer.

    Woher die Angaben kommen: aus den OBJEKTNAMEN im Modell. Raffi schreibt
    dort Geschoss, Bauteil, Dicke, Guete und Kostengruppe hinein, zum Beispiel
    "UG_AW_Waende_365mm_PP4-0,50_KG 340.001". Aendert sich diese Schreibweise,
    findet die Auswertung weniger.

    Ein SketchUp-Modell ist ein Entwurf: Rohbaumasse ohne Schichtaufbau. Die
    Mengen taugen zum Abschaetzen, nicht als Bestellmenge ohne Gegenrechnen.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Bautagesbericht_schreiben"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Bautagesbericht"
    - "Bautagesbericht schreiben"
    - "Bautagebuch"
    - "Bericht speichern"
    - "Wie schreibe ich einen Bautagesbericht"
    - "Tagesbericht"
    - "Bautagesberichte ansehen"
    - "Bericht freigeben"
    - "Bautagesbericht korrigieren"
    - "Bautagesbericht aendern"
  antwort: |
    Bautagesbericht schreiben:
    1. Baustelle oeffnen
    2. Oben rechts "Bautagesbericht erstellen"
    3. Datum, Witterung, Temperatur, Personalanzahl, Geraete, ausgefuehrte
       Arbeiten, Behinderungen und Notizen ausfuellen. Jedes Textfeld hat
       ein Mikrofon-Symbol - du kannst diktieren statt tippen.
    4. Oben rechts "Speichern & PDF"

    Der Knopf heisst mit Absicht so: Der Bericht wird zuerst als Datensatz
    gespeichert und das PDF danach aus diesem Datensatz erzeugt. So koennen
    Bericht und Ausdruck nicht auseinanderlaufen.

    Beim Speichern werden die Zaehlstaende der Baustelle festgehalten -
    Auftraege, LV-Positionen und Maengel, so wie sie an diesem Tag standen.
    Diese Zahlen aendern sich spaeter NICHT mehr. Kommt naechste Woche ein
    Mangel dazu, zeigt der Bericht von heute weiterhin den Stand von heute.
    Ein Bautagesbericht weist einen bestimmten Tag nach; wuerde er seine
    Zahlen beim Drucken neu holen, wuerde er die Vergangenheit umschreiben.

    Am Mac oeffnet sich ein "Sichern unter"-Fenster, auf iPhone und iPad das
    Teilen-Blatt (AirDrop, In Dateien sichern).

    Fruehere Berichte ansehen:
    Baustelle oeffnen, dann "Bautagesberichte ansehen". Die Liste zeigt alle
    Berichte dieser Baustelle, der neueste oben. Ein Bericht laesst sich
    oeffnen und erneut als PDF ausgeben - mit den Zahlen von damals.
    Bearbeiten geht dort nicht, und das ist Absicht: ein Bericht haelt einen
    vergangenen Tag fest.

    Freigeben:
    In der Berichtsansicht "Freigeben". Danach ist der Bericht ein Nachweis
    und wird nicht mehr geaendert. Festgehalten wird das Datum und der
    Firmenname aus den Einstellungen. Die Freigabe laesst sich nicht
    zuruecknehmen.

    Etwas richtigstellen:
    Bei einem freigegebenen Bericht "Korrektur anlegen". Das oeffnet ein
    neues Formular, vorbefuellt mit den Werten des Originals. Der alte
    Bericht bleibt unveraendert stehen, der neue verweist auf ihn. So bleibt
    nachvollziehbar, was urspruenglich dokumentiert wurde und was spaeter
    richtiggestellt wurde - genau das macht einen Nachweis aus.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Mops_Selbsterklaerung"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Was ist Mops"
    - "Was ist der Mops"
    - "Was kann Mops"
    - "Was kann der Mops"
    - "Was kann der Mops eigentlich"
    - "Wer bist du"
    - "Wer ist Mops"
  antwort: |
    Der Mops ist ein lokales LLM (llama3.2:3b), das auf einem CPU-Server
    (Mops-Box im Heimnetz) laeuft und Bau-Fachfragen beantwortet. Erreichbar
    ist er ueber den Tunnel mops.baumops.com — also auch von der Baustelle aus,
    nicht nur im Heimnetz. Die Server-Adresse ist in den Einstellungen
    aenderbar. Er nutzt
    eine RAG-Wissensbasis aus ~85 Wikipedia-Lemmas zu Bau-Themen (Mauerwerk,
    Beton, DIN-Normen etc.).

    Was er kann:
    - Bau-Fachfragen mit Quellen-Angabe (Wikipedia / Obsidian-Vault)
    - Hybrid-Suche: Vektor + Keyword-Boost (0.15) — exakte Begriffe gewinnen
    - Maurermeister-Persona: knapp, praktisch, ehrlich bei Wissenslücken

    Was er NICHT kann:
    - Sich selbst nahtlos erklaeren (dafuer gibt's diese Hilfe-Einträge!)
    - Sehr schnell antworten — CPU-only, 30 bis 120 Sekunden pro Frage
    - App-Bedienung erklären — das macht die iMOPS-Bedienungshilfe lokal

    Fuer komplexe Fragen den Prof-Schalter aktivieren (Claude Sonnet 4.5).
  quelle_kurz: "iMOPS Mops-Architektur (Welle-1)"
  license_note: "Eigene Selbsterklaerung"

- id: "App_iMOPS_Uebersicht"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Was kann iMOPS"
    - "Was kann die App"
    - "Was kann diese App"
    - "Was ist iMOPS"
    - "App Funktionen"
    - "App Features"
    - "Was kann ich machen"
  antwort: |
    iMOPS ist eine Baustellen-Management-App fuer Bauleiter und Poliere.
    Hauptfunktionen:

    - Baustellen-Verwaltung (Events mit Bauherr, Architekt, Standort)
    - LV-Erstellung + GAEB-Import (.x83/.x84/.x86) + PDF/CSV-Export
    - LV-Tiefenkalkulation (Material, Lohn, Geraete)
    - Maengelmanagement mit Foto, Frist, Push-Notifications und PDF-Protokoll
    - Auftraege (Jobs) mit Checklisten und SOP-Templates
    - Drag-and-Drop fuer GAEB, CAD (SKP/USDZ/OBJ), PDF, Excel, Bilder
    - 3D-CAD-Viewer (SceneKit)
    - BauWissen (Mops + Prof KI-Assistent)
    - BuildIQ (KI-Foto-Scanner fuer DIN-276-Kostengruppen)
    - Wetterintegration mit DIN-bezogenen Warnungen
    - Globale Suche und Fristenuebersicht

    Offline-first: alle Daten in CoreData, kein Cloud-Zwang.
  quelle_kurz: "iMOPS App-Uebersicht"
  license_note: "Eigene Selbsterklaerung"

- id: "App_BauWissen_Was_Fragen"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Was kann ich fragen"
    - "Was kann ich hier fragen"
    - "Wie nutze ich BauWissen"
    - "Wie frage ich"
    - "Welche Fragen"
    - "Beispiel Fragen"
  antwort: |
    Im BauWissen-Tab kannst du Fragen aus zwei Bereichen stellen:

    Bau-Fachwissen (Mops oder Prof beantwortet):
    - "Was ist eine tragende Wand?"
    - "Welche Frostschutzhoehe braucht ein Streifenfundament?"
    - "Wie unterscheiden sich C25/30 und C30/37?"
    - "Was sagt VOB/B Abs. 4?"

    Direkter Treffer aus iMOPS-Wissensbasis (sofort, lokal):
    - "Was ist DIN 276?" / "Kostengruppen"
    - "C25/30 Festigkeit" / "Beton C30/37"
    - "WLG 035" / "U-Wert"
    - "Mörtelgruppe MG II"
    - "GAEB DA XML"

    App-Bedienung (auch lokal, sofort):
    - "Wie lege ich eine Baustelle an?"
    - "Wie importiere ich GAEB?"
    - "Wie funktioniert der Prof-Schalter?"

    Bei langen Wartezeiten (>60s) den Prof-Schalter aktivieren — schneller
    und gruendlicher fuer komplexe Fragen. Antworten lassen sich mit
    "Antwort kopieren" ohne Textmarkieren in die Zwischenablage legen.
  quelle_kurz: "iMOPS BauWissen-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Prof_Schalter"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Prof Schalter"
    - "Prof aktivieren"
    - "Wann Prof"
    - "Wann nehme ich Prof"
    - "Prof statt Mops"
    - "Unterschied Mops Prof"
  antwort: |
    Der Prof-Schalter rechts oben im BauWissen-Eingabefeld wechselt das
    Antwort-Modell:

    Mops (Schalter aus, Standard):
    - llama3.2:3b lokal auf der Mops-Box
    - CPU-only, 30 bis 120 Sekunden Antwortzeit
    - Kostenlos
    - Gut fuer einfache Fakten-Fragen mit guter RAG-Quelle

    Prof (Schalter an):
    - Cloud-Prof ueber den Mops-Server
    - 5 bis 15 Sekunden Antwortzeit
    - Kostet pro Anfrage (API-Tokens)
    - Besser fuer komplexe, mehrteilige oder ungewoehnliche Fragen

    Faustregel: starte mit Mops, eskaliere zu Prof wenn die Antwort
    unbefriedigend ist oder die Frage komplex strukturiert ist.

    Beide Modi nutzen dieselbe RAG-Wissensbasis (bau_wissen_v1) und werden
    durch den iOS-side Pre-Filter umgangen wenn ein exakter Treffer existiert.
  quelle_kurz: "iMOPS BauWissen Mops/Prof-Architektur"
  license_note: "Eigene Bedienungshilfe"

- id: "App_XRechnung_fehlende_Preise"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "XRechnung exportieren"
    - "Rechnung exportieren"
    - "XRechnung geht nicht"
    - "Export nicht möglich fehlende Preise"
    - "Warum kann ich keine XRechnung erstellen"
    - "Position ohne Preis Export"
  antwort: |
    XRechnung-Export und fehlende Preise:

    Der XRechnung-Export wird BLOCKIERT, sobald mindestens eine Position
    keinen Preis hat. "Kein Preis" heißt: weder ein Angebot im
    Angebotsvergleich noch eine hinterlegte Kalkulation (Tiefenkalkulation
    oder Pauschal-/NU-Träger). Das verhindert versehentliche Rechnungen
    mit 0,00-€-Positionen.

    Meldung "Export nicht möglich – fehlende Preise":
    1. Im LV die betroffene Position öffnen
    2. Entweder im Angebotsvergleich (⋯ → Angebotsvergleich) einen Preis
       erfassen ODER die Position kalkulieren (⋯ → Kalkulation)
    3. Export erneut starten

    Unterschied zu GAEB X84: Der GAEB-Export warnt nur und lässt sich mit
    "Trotzdem exportieren" fortsetzen (leere EP-Felder sind dort zulässig,
    z.B. für eine Angebotsaufforderung). Die XRechnung dagegen blockt hart.

    Der angesetzte Einzelpreis ist überall derselbe (eine Wahrheit):
    günstigstes Angebot, sonst kalkulierter VK-Preis, sonst 0.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Aufwand_Eingabe"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Lohnanteil hinzufuegen"
    - "Material hinzufuegen Kalkulation"
    - "Geraet hinzufuegen"
    - "Stunden je Einheit"
    - "Aufwand eingeben"
    - "warum so viele Stunden"
    - "Positions-Gesamt Vorschau"
    - "gesamt eingeben statt je Einheit"
    - "Umschalter je Einheit gesamt"
  antwort: |
    Beim Kalkulieren einer Position (Tiefenkalkulation → Lohn/Material/Geraete
    hinzufuegen) gibt es einen Umschalter "je Einheit / gesamt":
    - "je Einheit" (Standard): der Aufwand JE EINHEIT, z.B. 0,5 h je m3 (Lohn/Geraete)
      bzw. 25 kg je m3 (Material). Das ist die Rechenbasis der Engine (x Menge).
    - "gesamt": der GESAMTWERT fuer die ganze Position, z.B. "6 h" oder "130 kg".
      Die App teilt selbst durch die Positions-Menge — man braucht keinen Taschenrechner.
    Gespeichert wird immer der Wert je Einheit; die Engine bleibt gleich. (Der "gesamt"-
    Modus braucht eine gesetzte Positions-Menge, sonst ist er deaktiviert.)

    Die Vorschau zeigt immer DREI Zeilen, egal welcher Modus:
    1. Kosten je Einheit
    2. Menge gesamt (Stunden bzw. Materialmenge fuer die ganze Position)
    3. GESAMT fuer die Positions-Menge (Euro)

    So faellt ein Fehler sofort auf: Traegt man im "je Einheit"-Modus bei 120 m3
    versehentlich 4 statt 0,05 ein, zeigt die Vorschau "Menge gesamt 480 h" — kann nicht
    stimmen. Merksatz: Im Zweifel "gesamt" waehlen und den bekannten Gesamtwert eintippen.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Materialliste_Excel"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Mengen aus Excel"
    - "Materialliste einlesen"
    - "SketchUp Mengen"
    - "Excel ins LV"
    - "xlsx hochladen"
    - "Mengenauszug Excel"
  antwort: |
    In der Baustelle (Event-Detail) gibt es die Karte "Mengen aus Excel lesen".
    Damit liest die App einen SketchUp-Mengenauszug (.xlsx) ein: Datei waehlen ->
    die App schickt sie an den Mops-Server (/materialliste) -> zurueck kommen
    Positionen je Kategorie (Aussenwand/Innenwand/Putz/Boden/Beton/Ringbalken/Sturz)
    mit Menge (m3 / m2 / Stueck). Ankreuzen, was ins LV soll, dann "Ins LV uebernehmen".
    Die Positionen kommen als Schaetzung ins LV (mengenQuelle = schaetzung), mit
    Herkunft (Datei + Position) in quellDatei. Volumen und Masse sind Fakt aus SketchUp,
    die Einordnung in Kategorien ist abgeleitet — darum als Schaetzung markiert.
    Gegenstueck zu "Waende aus Plan lesen" (DXF): dort rechnet die App die Mengen aus
    der Geometrie, hier hat SketchUp sie schon fertig im Excel.

    Auch eine gruppierte "Bestellliste Übersicht" (.xlsx, Steine/Stahl/Schotter …) wird
    automatisch erkannt: jede Gruppe (1.00/2.00/…) kommt als eigene Sektion ins LV,
    darunter die Einzelpositionen als Belege. Das Layout muss nicht eingestellt werden —
    der Server unterscheidet SketchUp-Auszug und Bestellliste selbst.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Material_Bestellung_Ecke"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Wo ist die Materialliste"
    - "Material und Bestellung"
    - "Was bestelle ich"
    - "Was ist auf Lager"
    - "Bestellliste finden"
    - "Lager oeffnen"
  antwort: |
    In der Baustelle (Event-Detail) gibt es die eigene Ecke "Material & Bestellung".
    Sie ist der Beschaffungs-Ort — bewusst getrennt von "Leistungsverzeichnis und
    Kalkulation" (dort geht es um Kosten, hier ums Bestellen und den Lagerbestand).
    Darin:
    - Materialliste: der Material-Bedarf dieser Baustelle (aus dem Auslesen), mit
      Soll/Ist-Abgleich gegen das Lager ("Lager sagt vorhanden, vor Ort fehlt" wird
      rot gemeldet).
    - Lager: Bestand (= Summe der Buchungen), Meldebestand, Nachbestellen.
    - Bestellliste: was fehlt, je Lieferant, bis zum Bestellschein (PDF/Mail).
    Frueher lag die Materialliste unter der Kalkulation — sie ist dorthin verschoben,
    wo Lager und Bestellliste ohnehin leben, damit die Beschaffung an einem Ort ist.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Preis_Waechter"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Preis-Wächter"
    - "Preis prüfen"
    - "falscher Preis"
    - "Komma-Fehler Preis"
    - "Ausreißer Preis"
    - "Zahl prüfen Angebot"
  antwort: |
    In der Baustelle unter "Leistungsverzeichnis und Kalkulation" gibt es die Karte
    "Preis-Wächter". Sie prüft die Einheitspreise DIESER Baustelle gegen die
    gleichartigen Positionen (gleiche Einheit) und meldet Auffälligkeiten, BEVOR das
    Angebot rausgeht:
    - Komma-/Zehnerpotenz-Falle: ein EP ist ~10× / 100× (oder 1/10, 1/100) vom Mittel
      der Nachbarn — fast immer ein verrutschtes Komma (z. B. 8,02 statt 80,21).
    - Ausreißer: ein EP fällt robust (Median + MAD) aus dem Rahmen.
    Steht "N Zahlen prüfen", tippt man die Karte auf und sieht je Fund den Preis + Grund.
    Der Wächter sagt "prüf diese Zahl", nie "falsch" — der Mensch entscheidet. Bei
    normaler Preisstreuung oder zu wenigen gleichartigen Positionen schweigt er.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Terminplan_Zeit"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Terminplan"
    - "Zeit im Canvas"
    - "wann ist was fertig"
    - "Bauablauf Zeit"
    - "Dauer je Auftrag"
    - "Härtezeit Trocknungszeit"
  antwort: |
    In der Baustelle unter "Aufträge für Arbeit" gibt es die Karte "Terminplan".
    Sie rechnet aus dem Abhängigkeitsgraph (welcher Auftrag auf welchen wartet) die
    frühesten Start-/Endtage — als Tage-Balken je Auftrag, relativ zum Baustellenstart.
    - Dauer je Auftrag setzt man direkt mit dem Stepper (Tage).
    - Wartezeit, in der NIEMAND arbeitet (Beton härten, Estrich trocknen), gehört an
      die VERBINDUNG zwischen zwei Aufträgen (Übergangszeit) — die wird mitgerechnet,
      sobald sie gesetzt ist.
    - Eine Ringabhängigkeit (A wartet auf B wartet auf A) wird ehrlich gemeldet statt
      still falsch gerechnet.
    Ein Termin ist eine Schätzung mit Herkunft, kein Vertrag — Wetter/Lieferung
    verschieben, der Mensch bestätigt.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Angebots_Waechter"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Angebots-Wächter"
    - "Position ohne Preis"
    - "Position ohne Menge"
    - "Lücke im Angebot"
    - "Angebot vollständig"
    - "was fehlt im Angebot"
  antwort: |
    In der Baustelle unter "Leistungsverzeichnis und Kalkulation" gibt es neben dem
    Preis-Wächter die Karte "Angebots-Wächter". Sie meldet LÜCKEN, bevor das Angebot
    rausgeht:
    - Position ohne Einheitspreis (noch nicht bepreist).
    - Position ohne Menge (im Angebot stünde 0).
    Überschriften/Titel (keine Menge, keine Einheit, kein Preis) sind Gliederung und
    keine Lücke; Alternativpositionen zählen auch nicht. Steht "N Lücken", tippt man
    die Karte auf und sieht je Fund die Position + Grund. Ergänzt den Preis-Wächter:
    der prüft falsche Zahlen, dieser fehlende.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Mops_Wegweiser"
  kategorie: "app-bedienung"
