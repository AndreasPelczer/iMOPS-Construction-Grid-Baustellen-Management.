  antwort: |
    Wenn ein Bebauungsplan ueber "Unterlagen auswerten" ausgewertet UND gespeichert
    wurde, erscheint in der Baustelle (Karte "Plaene & Unterlagen") die Karte
    "Vorgaben aus dem Bebauungsplan". Sie zeigt die ausgelesenen Vorgaben als Liste:
    Zone, GRZ/GFZ, max. Wand-/Firsthoehe, max. Abgrabung/Auffuellung/Stuetzwand,
    Dachform + Neigung, Stellplatz-Pflicht, Pflanzgebot.

    Das sind REINE ZITATE aus dem Dokument (KI-Auslesung, im Zweifel am Plan pruefen) -
    es findet noch KEIN Abgleich mit den Projektwerten statt (kommt spaeter als Ampel).
    Fehlt eine Vorgabe im Plan, wird sie weggelassen. Ist kein B-Plan ausgewertet,
    erscheint die Karte gar nicht.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Gelaendebruecke"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Geländebrücke"
    - "Aushub berechnen"
    - "wie viel Erde muss weg"
    - "Cut Fill"
    - "Abtrag Auftrag"
    - "Aushubtiefe"
    - "DXF auswerten"
  antwort: |
    Die Karte "Geländebrücke" (in "Plaene & Unterlagen") schaetzt aus einem
    Vermessungs-DXF den Erdaushub:
    1. "DXF auswerten" tippen, das Bestands-DXF (Höhenpunkte/-linien) waehlen.
    2. Optional OK-Bodenplatte fest vorgeben; leer = Auto (Massenausgleich).
    3. Ergebnis: Abtrag/Auftrag (m³), Schotter (t), LKW-Fuhren, und die
       "Max. Aushubtiefe" (hoechster Gelaendepunkt minus OK-Bodenplatte).
    4. Ist ein Bebauungsplan mit "Abgrabung max." ausgewertet, zeigt eine
       gruene/rote Ampel, ob die Aushubtiefe im erlaubten Rahmen bleibt.
    5. "Ins LV uebernehmen" schreibt die Mengen als Positionen (geschaetzt);
       "PDF-Report" erzeugt einen Aushub-Bericht.

    WICHTIG: Das DXF braucht ein eingezeichnetes geplantes Haus (Layer
    "Geplante Hauslage" o. ä.) - sonst meldet es "kein geplantes Haus" und
    kann den Aushub nicht rechnen. Fehlt das Haus, erscheint der Knopf
    "Hauslage platzieren" (siehe App_Hauslage_Platzieren). Es ist eine
    Planungs-Schaetzung, ersetzt NICHT Vermesser oder Bodengutachten.
  quelle_kurz: "iMOPS App-Bedienung (Welle 7)"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Hauslage_Platzieren"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Hauslage platzieren"
    - "kein geplantes Haus"
    - "kein Haus im DXF"
    - "Haus fehlt im Plan"
    - "Grundstueck anzeigen"
    - "Grundstuecksgrenzen"
    - "Haus selbst einzeichnen"
  antwort: |
    Meldet die Geländebrücke "kein geplantes Haus", erscheint darunter der Knopf
    "Hauslage platzieren". Er zeigt das Grundstueck aus demselben DXF, das schon
    geladen ist - Grundstuecksgrenzen und Gelaende-Ausdehnung, massstaeblich
    eingepasst. Es wird NICHT neu hochgeladen und NICHT neu gerechnet.

    Stand heute ist das eine reine Ansicht: man sieht, wo das Grundstueck liegt
    und wie hoch das Gelaende reicht. Das Haus-Rechteck zum Verschieben und
    Drehen kommt im naechsten Schritt; erst dann koennen die Ecken als
    Hauslage an die Aushubrechnung gehen.

    Es funktioniert mit DXF und DWG - der Dateiname wird mitgeschickt, damit die
    Box eine DWG vorher wandelt.
  quelle_kurz: "iMOPS App-Bedienung (Welle 7, Schritt 2b)"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Ist_Uebersicht"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Ist-Übersicht"
    - "Baustellen-Übersicht"
    - "Ist-Kosten"
    - "echte LV-Daten anzeigen"
    - "Übersicht aus importierten Daten"
    - "Wo sehe ich die echten Kosten der Baustelle"
  antwort: |
    Die Ist-Übersicht zeigt die Baustelle aus den ECHTEN importierten LV-Daten
    (nicht die Planer-Schaetzung):
    1. Baustelle oeffnen -> oben die Karte "Baustellen-Übersicht" -> "Ist-Übersicht"
       antippen. Die Karte erscheint automatisch: sind LV-Daten da, fuehrt sie in die
       Ist-Übersicht (darunter ein kleiner Link "Gegen Kennwert pruefen", der das
       kalkulierte LV der Schaetzung gegenueberstellt und von dort auch in den Planer
       fuehrt); ist die Baustelle leer, bietet sie stattdessen das Planen (Soll) an.
    2. Kopf: Projekt/Baustelle/Quelldatei aus dem Import + Positionsanzahl, Netto, Brutto.
       Sind Unterlagen ausgewertet UND gespeichert (Karte "Unterlagen auswerten"), zeigt
       der Kopf zusaetzlich Kern-Fakten als Chips: Bodenklasse, Wohnflaeche, Zone/GRZ,
       Anzahl Erschliessungs-Medien.
    3. Reiter:
       - Kosten: nach DIN-276-Kostengruppe (Netto/MwSt/Brutto).
       - Massen: nach LV-Titel (fuehrende Positionsnummer), Menge + Einheit je Position.
       - Material: Positionen mit Artikel-Nr./Lieferant (bei Statik-/Bestell-Import gefuellt).
       - Zeitplan: Bauzeitraum (Start/Ende) + eigene Bauphasen anlegen (Name/Gewerk +
         Start/Ende) als Terminplan; Balken = Zeit-Fortschritt der Phase. Antippen = bearbeiten,
         Wischen = loeschen. (Bauzeitraum-Termine selbst setzt du ueber "Bearbeiten".)

    Unterschied zur "Soll-Übersicht": die Soll-Übersicht ist die Planer-Schaetzung
    (Angebot), die Ist-Übersicht sind die tatsaechlich importierten Daten. Geschaetzte
    Mengen sind mit "geschaetzt" markiert (gemessen verdraengt geschaetzt).
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_LV_Element_Kalkulation"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "B-Element"
    - "Element rechnen"
    - "Element kalkulieren"
    - "Einheitspreis aus mehreren Positionen"
    - "Preis je Quadratmeter aus Arbeitsschritten"
    - "Rezept-Mass"
    - "Bausteine summieren"
    - "Deckel summiert Bausteine"
    - "Arbeitsschritte zu einem Preis zusammenfassen"
  antwort: |
    Ein Deckel im LV kann ZWEI verschiedene Dinge sein. Umschalten: lange auf den
    Deckel druecken (Rechtsklick am Mac) -> "Als Element rechnen" bzw. "Wieder als
    Mengentraeger rechnen".

    1) Mengentraeger (Vorgabe, orange): der Deckel traegt die Menge, die Unterpunkte
       sind Beleg und "zaehlen nicht". So kommen Excel- und Bestelllisten-Importe herein.

    2) Element (indigo): der Deckel ist die SUMME seiner Bausteine. Beispiel Pflaster:
       Untergrund, Frostschutz, Bettung, Verlegen, Schneiden, Einsanden, Abruetteln,
       Nacharbeiten - am Ende steht ein Einheitspreis, z.B. 87,00 EUR/m².

    So legst du ein Element an:
    - Positionen im LV auswaehlen und gruppieren (der Deckel entsteht).
    - Deckel lange druecken -> "Als Element rechnen".
    - Am Deckel Bezugsmenge und Einheit setzen (z.B. 100 m²) - ueber "Bearbeiten".
    - Je Baustein antippen -> "Bearbeiten" -> Feld "Rezept-Mass": wie viel je Einheit
      des Elements gebraucht wird, z.B. 0,35 m³ Schotter je m² Pflaster. Die Vorschau
      zeigt sofort die tatsaechliche Menge (0,35 x 100 = 35 m³).
    - In jedem Baustein wie gewohnt Material, Lohn und Geraet kalkulieren.

    Wichtig: Zuschlaege (BGK, Wagnis & Gewinn) werden EINMAL oben am Element
    gerechnet, nicht je Baustein - sonst wuerde doppelt aufgeschlagen. Die
    Zuschlagsfelder eines Bausteins bleiben deshalb ohne Wirkung, solange er unter
    einem Element haengt.

    Vorteil: das Element ist ein Rezept. Aendert sich die Flaeche, bleibt der Preis
    je m² gleich und die Gesamtsumme rechnet sich neu. Die Bausteine duerfen dabei
    in anderen Einheiten rechnen als das Element (m³, lfm, Stunden) - die Umrechnung
    macht das Rezept-Mass.

    "Aufloesen" macht aus der Gruppe wieder Einzelpositionen und setzt den Deckel
    auf Mengentraeger zurueck.
  quelle_kurz: "iMOPS App-Bedienung"
  license_note: "Eigene Bedienungshilfe"

- id: "App_Zuschlag_Je_Kostenart"
  kategorie: "app-bedienung"
  app_version_min: "1.0"
  aliases:
    - "Zuschlag je Kostenart"
    - "Zuschlag auf Lohn"
    - "Lohnzuschlag"
    - "unterschiedliche Zuschlaege"
    - "Zuschlagsgruppen"
    - "Faktor auf den Lohn"
    - "Gemeinkosten auf Lohn"
    - "Lohnstunden"
    - "Mannstunden"
    - "wie viele Stunden steckt im Angebot"
  antwort: |
    WO DIE SAETZE STEHEN: unter Einstellungen -> "Kalkulation — Zuschlaege". Dort
    einmal gepflegt, gelten sie fuer JEDE Position, die nicht ausdruecklich abweicht.
    Wer eine einzelne Position anders rechnen will, schaltet in der Tiefenkalkulation
    "Von den Firmenwerten abweichen" ein — dann werden die Regler dort bedienbar und
    gelten nur fuer diese eine Position. Solange der Schalter aus ist, zeigen die
    Regler die Firmenwerte grau an, damit sichtbar ist, womit gerechnet wird.

    Beim Umschalten auf "abweichen" werden die aktuellen Firmenwerte uebernommen —
    der Preis springt also nicht, nur weil man "abweichen" antippt.

    Ausserdem gibt es den Schalter "Je Kostenart aufschlagen".

    AUS (Vorgabe): ein Satz Wagnis & Gewinn und ein Satz BGK, beide auf die
    Selbstkosten. So war es immer.

    AN: je Kostenart ein eigener Satz — Lohn, Material, Geraet getrennt. Das
    entspricht der ueblichen Praxis: der Lohn traegt den Loewenanteil von
    Gemeinkosten und Gewinn, Material und Geraet kaum etwas. Groessenordnungen aus
    der Praxis: Lohn mal 2,75 (also 175 %), Material mal 1,15, Geraet mal 1,10.
    W&G und BGK werden in diesem Modus NICHT zusaetzlich gerechnet.

    Wichtig: das Umschalten allein aendert keinen Preis. Die drei Saetze starten bei
    je 20 % — das ist dieselbe Summe wie 12 % BGK + 8 % W&G auf alles. Erst wer an
    einem Regler dreht, veraendert die Zahl.

    Jeder Regler zeigt beides: den Prozentsatz und den Faktor (175 % = x2,75). Im
    Ergebnis steht der Aufschlag dann dort, wo er entsteht — so siehst du, dass der
    Lohn das Geld traegt.

    Beim B-Element gilt der Zuschlag am Element, nicht an den Bausteinen. Ein
    Baustein rechnet immer zuschlagsfrei, egal was an ihm eingestellt ist.

    LOHNSTUNDEN: unten im LV steht neben der Angebotssumme, wie viele Lohnstunden
    das ganze Angebot bedeutet — die Groesse, an der Termine und Mannschaftsstaerke
    haengen. In der Tiefenkalkulation stehen sie je Position (gesamt und je Einheit).
    Geraetestunden zaehlen NICHT mit: die Maschine steht auch, wenn niemand
    danebensteht. Belege unter einem Deckel zaehlen nicht doppelt.
