  antwort: |
    Aus Excel/DXF uebernommene Mengen liegen im LV als Gruppe: ein "Deckel"
    (die zaehlende Position mit der Gesamtmenge) und darunter die einzelnen
    Belege ("zaehlt nicht"). Beide sind bearbeit- und kalkulierbar:
    - Deckel: nach links wischen -> "Bearbeiten" / "Kalkulation"; oder lange
      druecken (Rechtsklick am Mac) fuer Bearbeiten/Kalkulation/Fortschritt/Aufmass.
      Der Deckel ist die zaehlende Position -> hier gehoert die Kalkulation hin.
    - Einzelner Beleg: antippen oeffnet den Dialog (Bearbeiten/Kalkulation ...),
      oder lange druecken.
    Tippen auf den Deckel klappt weiterhin die Gruppe auf/zu; "Aufloesen" (Wisch
