# BKI-Marktpreise — Referenz/Orakel, NICHT Kalkulationsgrundlage.
# ============================================================================
# Der Mops rechnet WEITER von unten auf (Material + Lohn + Gerät = deine echten
# Kosten + Aufschlag). Diese Datei ist nur der MARKT-VERGLEICH daneben: BKI-
# Baupreise aus abgerechneten Objekten. So siehst du, ob dein Einheitspreis
# plausibel liegt — ohne dass eine fremde Zahl deine Kalkulation überschreibt.
#
# NACHWEIS: jeder Eintrag trägt seine BKI-Position + BKI-ID. Kein Raten, kein
# Internet — Baudatenbank der Deutschen Architektenkammern, mit Abo lizenziert.
#
# PFLICHT je Eintrag: einheit + mittel (der Ø aus der BKI-Trefferliste).
# OPTIONAL: min/von/bis/max (die volle Spanne — nur wenn per Klick geerntet).
# Schlüssel = STLB-Baustein-ID (wie in stlb_bausteine.yaml).

