# ============================================================================
# MASCHINENKATALOG BAU — Geräte, Einsatzgebiete & Mietkosten für den Mops
# ============================================================================
#
# Zweck: Der Mops liest eine LV-Position ("Baugrube ausheben 2400 m³"),
# erkennt die Tätigkeit, schlägt die passende(n) Maschine(n) vor,
# berechnet die Einsatzdauer und trägt die Gerätekosten ins LV ein.
#
# Aufbau pro Maschine:
#   - bezeichnung: Klartext
#   - kategorie: Erdbau / Verdichtung / Beton / Transport / Heben / ...
#   - gewichtsklasse: leicht / mittel / schwer
#   - leistung: Was die Maschine pro Stunde schafft (m³/h, m²/h, etc.)
#   - miete: Tages-/Wochen-/Monatssätze (netto, Stand 2026)
#   - diesel: Verbrauch l/h (für Kostenrechnung)
#   - einsatz_bei: Liste von Tätigkeiten aus aufwandswerte_bau.yaml
#   - braucht_schein: Führerschein / Baggerschein / ohne
#   - transport: Wie kommt die Maschine auf die Baustelle
#
# Quellen:
#   [BIBERGER]   biberger.de Mietkosten Baumaschinen (2026)
#   [MIET24]     miet24.de Preisvergleich (2026)
#   [STAIB]      staib-baumaschinen.de Mietpreisliste 01/2026
#   [FRANKEN]    franken-baumaschinen.de Mietkatalog 2026
#   [BNG]        bng-schlueter.de Mietpreisbroschüre
#   [FIENE]      baggerverleih-schwerte-fiene.de Preise
#   [PRAXIS]     Allgemeine Marktpreise / Erfahrungswerte
#
# WICHTIG: Mietpreise sind Richtwerte und schwanken regional ±20%.
# Der Mops zeigt sie als Vorschlag (GELB). Firmeninterne Sätze oder
# eigene Maschinen haben immer Vorrang.
#
# Letzte Aktualisierung: September 2026
# ============================================================================

meta:
  version: "1.0.0"
  stand: "2026-09"
  waehrung: "EUR"
  mietpreise_basis: "netto pro Arbeitstag (8h), Deutschland Mitte"
  hinweis: >
    Mietpreise sind Durchschnittswerte 2026 aus öffentlichen Preislisten.
    Regional ±20%. Versicherung (ca. 10% Aufschlag) und Transport nicht
    enthalten, sofern nicht anders angegeben. Bei eigenen Maschinen:
    Vorhaltekosten nach BGL (Baugeräteliste) verwenden.

