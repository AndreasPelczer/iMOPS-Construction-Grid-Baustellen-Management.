# ============================================================================
# AUFWANDSWERTE BAU — Arbeitszeit-Richtwerte für den Mops
# ============================================================================
#
# Format: Std pro Einheit (h/m², h/m³, h/lfm, h/St, h/t)
# Werte: min / mittel / max (Bandbreite je nach Schwierigkeitsgrad)
#
# WICHTIG: Diese Werte sind RICHTWERTE aus öffentlichen Quellen,
# NICHT die geschützten ARH-Tabellen des Zeittechnik-Verlags.
# Sie ersetzen KEINE firmeninternen Kalkulationsansätze.
# Der Mops nutzt sie als Startpunkt — Raffi korrigiert aus Erfahrung.
#
# Prinzip: "mittel" ist der Normalfall bei durchschnittlichen Bedingungen.
# "min" bei optimalen Bedingungen (großflächig, repetitiv, gute Zugänglichkeit).
# "max" bei erschwerten Bedingungen (beengt, komplex, Altbau, Winter).
#
# Quellen:
#   [ARH]     Arbeitszeit-Richtwerte Hochbau/Tiefbau (Zeittechnik-Verlag) — öffentl. Bandbreiten
#   [HOF]     Hofstadler, C. (2008): Schalarbeiten / Bauablaufplanung, Springer
#   [BNW]     BauNetz Wissen (baunetzwissen.de)
#   [PAK]     pak-immo.at — Aufwandswert und Leistungswert (2026)
#   [BUB]     bubiza.de — DaviD WIKI Aufwandswerte Mauerwerk
#   [FSG]     Fachschule Gotha, Baubetrieb Teil 1 (2024)
#   [CIV]     clean-invoice.com — Baukosten-Ratgeber (2026)
#   [ART-P]   ART Pflasterarbeiten (Zeittechnik-Verlag, öffentl. Leseprobe)
#   [REFA]    REFA Verband, Fachauss. Bauwesen — Zeitartengliederung
#   [PRAXIS]  Allgemeine Baupraxis-Erfahrungswerte
#
# Letzte Aktualisierung: September 2026
# ============================================================================

meta:
  version: "1.0.0"
  stand: "2026-09"
  waehrung: "EUR"
  hinweis: >
    Richtwerte aus öffentlichen Quellen. Keine geschützten ARH-Tabellen.
    Firmeninterne Werte haben immer Vorrang. Der Mops zeigt diese Werte
    als Vorschlag an (GELB), nie als Fakt (GRÜN) — es sei denn, die Firma
    hat eigene Werte hinterlegt.

