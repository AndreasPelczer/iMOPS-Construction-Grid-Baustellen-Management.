    gewerk: "Straßenbau"
    aufwandswert_key: "strassenbau.gehweg_wiederherstellen"
    tags: ["Gehweg", "wiederherstellen", "Betonpflaster"]

# ============================================================================
# 21 — DACHDURCHFÜHRUNGEN / SONDERPOSITIONEN
# ============================================================================
sonder:

  SON-001:
    kurztext: "Dachdurchführung Lüftungsrohr"
    langtext: >
      Dachdurchführung für Lüftungsrohr {{dn}} herstellen. Einschl.
      Durchgangsziegel, Bleieinfassung und Stutzen. Regendichte Ausführung.
      {{stueck}} Stück.
    einheit: "St"
    gewerk: "Dachdeckerarbeiten"
    aufwandswert_key: "dacharbeiten.dachdurchfuehrung"
    tags: ["Dachdurchführung", "Lüftung", "Dunstabzug", "Entlüftung"]

  SON-002:
    kurztext: "Ortgangblech"
